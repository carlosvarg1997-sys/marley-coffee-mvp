<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/webp" href="../../recursos/marca/logo.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="light">
  <title>Abrir una vista · Prueba con personas</title>
  <link rel="stylesheet" href="../../captacion/marca/negro-marley.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f3f1;color:#171717;font:16px/1.55 "Helvetica Neue",Arial,sans-serif}
    main{width:min(680px,100%);padding:clamp(22px,5vw,42px);border:1px solid #cfcfcb;border-radius:14px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    .eyebrow{margin:0 0 8px;color:#525252;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(27px,5vw,40px);line-height:1.05}
    p{margin:14px 0 0;color:#383838}
    .route{overflow-wrap:anywhere;color:#5a5a5a;font-size:13px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border:1.5px solid #171717;border-radius:8px;background:#fff;color:#171717;font-weight:800;text-decoration:none}
    a.primary{border-color:#f3c900;background:#f3c900}
    a:focus-visible{outline:3px solid #171717;outline-offset:3px}
    @media(max-width:480px){.actions a{width:100%}}
  </style>
</head>
<body class="nm">
  <main>
    <p class="eyebrow">Prueba con personas · vista local</p>
    <h1 id="heading">Abrir vista</h1>
    <p id="notice">Fuera del recorrido, la vista muestra datos de ejemplo. No ingreses datos reales.</p>
    <p class="route" id="route"></p>
    <div class="actions"><a class="primary" id="continue" href="inicio.html">Continuar</a><a href="flujos.html">Volver a los flujos</a></div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const target = params.get('destino') || 'inicio.html';
      const requested = params.get('solicitado') || target;
      const notice = params.get('aviso') || 'Fuera del recorrido, la vista muestra datos de ejemplo.';
      const path = params.get('camino') || '';
      document.getElementById('notice').textContent = notice;
      document.getElementById('route').textContent = `Camino ${path} · destino: ${requested}`;
      const link = document.getElementById('continue');
      link.href = target;
      link.textContent = target === requested ? 'Abrir la vista' : 'Abrir inicio del camino';
      if (target !== requested) document.getElementById('heading').textContent = 'Esta vista requiere el recorrido';
    })();
  </script>
</body>
</html>
