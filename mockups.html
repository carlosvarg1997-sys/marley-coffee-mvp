  // ---------- Llamada en vivo ----------
  function liveCallBanner(s) {
    if (!s.call || s.call.status !== 'llamando' || !s.lead) return '';
    return `<div class="m5-callbar">${icon('phone', 20)}<div><b>En llamada con ${esc(s.lead.name || s.lead.id)}</b><small>${esc(s.answers.negocio || '')} · ${esc(s.answers.comuna || '')}</small></div>${timer(s.call.startedAt)}<button type="button" class="m4-btn m4-btn--sm" data-a="open-conv" data-v="${s.lead.id}">Abrir llamada</button></div>`;
  }
  function callPanel(s) {
    const c = s.call; const f = c.ficha || {}; const L = s.lead || {};
    const opt = (list, v) => list.map((x) => { const [val, lab] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');
    const fields = {
      volumen: `<select id="m5F-volumen" data-a="call-field" data-k="volumen"><option value="">—</option>${opt(M.QUESTIONS[2].options, f.volumen)}</select>`,
      maquina: `<select id="m5F-maquina" data-a="call-field" data-k="maquina"><option value="">—</option>${opt(D.MACHINE_ORDER.map((k) => [k, D.MACHINES[k].name + ' · ' + D.MACHINES[k].kind]), f.maquina)}</select>`,
      horario: `<input id="m5F-horario" data-a="call-field" data-k="horario" value="${esc(f.horario || '')}" placeholder="Ej.: martes y jueves antes de las 10:00">`,
      decide: `<input id="m5F-decide" data-a="call-field" data-k="decide" value="${esc(f.decide || '')}" placeholder="Nombre y cargo">`,
      inicio: `<select id="m5F-inicio" data-a="call-field" data-k="inicio"><option value="">—</option>${opt(['Esta semana', 'Este mes', 'Próximo mes', 'Sin apuro'], f.inicio)}</select>`
    };
    const script = [`Saludo: «Hola ${esc(M.firstName(s) || '')}, soy Paula. Vi tu diagnóstico: ${esc((s.answers.negocio || 'negocio').toLowerCase())} en ${esc(s.answers.comuna || 'tu comuna')}».`, 'Confirmar tazas al día y horario de despacho.', `Proponer máquina ${esc((D.MACHINES[f.maquina] || {}).name || '')} y modalidad (arriendo o compra directa).`, `Ofrecer ampliación: ${esc(((s.lmi || []).map((x) => D.SERVICES[x.k].t.toLowerCase()).join(', ')) || D.lmFit(s.answers.negocio).ampl.map((k) => D.SERVICES[k].t.toLowerCase()).slice(0, 2).join(' o '))} (LM4).`, 'Acordar siguiente paso y quién decide.'];
    return `<section class="m5-callpanel" aria-label="Llamada en curso"><div class="m5-cp-head"><span class="m5-cp-ic">${icon('phone', 20)}</span><div><b>En llamada con ${esc(L.name || L.id)}</b><small>${esc(L.phone || 'sin número')} · ${esc(L.company || '')}${c.sim ? ' · <em class="m4-sim">simulada</em>' : ''}</small></div>${timer(c.startedAt)}</div>
<div class="m5-cp-grid"><div class="m5-cp-ficha"><h3>Ficha de la llamada</h3><p class="m4-fine">${icon('info', 14)} El cliente ve estos datos en su portal mientras hablan («Lo que vamos acordando»).</p>${M.FICHA.map(([k, l]) => `<label class="m5-cp-field"><span>${esc(l)}</span>${fields[k]}</label>`).join('')}</div>
<div class="m5-cp-side"><h3>Guion</h3><ol class="m5-cp-script">${script.map((x) => `<li><label><input type="checkbox"> <span>${x}</span></label></li>`).join('')}</ol>
<label class="m5-cp-field"><span>Notas (se guardan solas)</span><textarea id="m5CallNotes" rows="4" placeholder="Lo que dijo, dudas, objeciones…">${esc(c.notes || '')}</textarea></label><small class="m4-fine" data-notes-saved>${c.notesAt ? 'Guardado ' + U.time(c.notesAt) : 'Sin notas todavía'}</small></div></div>
<div class="m5-cp-end"><label class="m5-cp-field"><span>Resultado</span><select id="m5CallOut">${opt(['Interesado', 'Pide cotización', 'Volver a llamar', 'No contesta', 'No le interesa'], 'Interesado')}</select></label><label class="m5-cp-field"><span>Siguiente paso</span><select id="m5CallNext">${opt(['Enviar cotización', 'Agendar visita', 'Llamar mañana', 'Nutrición por correo'], 'Enviar cotización')}</select></label><button type="button" class="m4-btn" data-a="call-end">${icon('check', 18)} Cortar y registrar</button></div></section>`;
  }

  // ---------- Agenda (Ventas) ----------
  function agendaItems(s) {
    const items = [];
    if (s.call && s.lead) {
      if (s.call.status === 'llamando') items.push({ h: 'Ahora', t: 'Llamada', who: s.lead.name || s.lead.id, what: 'En curso', act: `<button type="button" class="m4-btn m4-btn--sm" data-a="open-conv" data-v="${s.lead.id}">Abrir</button>`, live: true });
      else if (s.call.status === 'agendada') items.push({ h: s.call.slot.replace(/^(Hoy|Mañana) a las /, ''), t: 'Llamada', who: s.lead.name || s.lead.id, what: 'Agendada por el cliente · ' + s.call.slot, act: `<button type="button" class="m4-btn m4-btn--sm" data-a="open-conv" data-v="${s.lead.id}">Preparar</button>`, live: true });
      else if (s.call.status === 'cola') items.push({ h: 'Ahora', t: 'Llamada', who: s.lead.name || s.lead.id, what: 'En cola · pidió que la llamen', act: `<button type="button" class="m4-btn m4-btn--sm" data-a="open-conv" data-v="${s.lead.id}">Llamar</button>`, live: true });
    }
    const due = accounts().filter((a) => a.st.dueIn !== null && a.st.dueIn <= 1 && a.st.in90 > 0 && zoneOfComuna(a.comuna)?.id === 'oriente').slice(0, 2);
    due.forEach((a, i) => items.push({ h: ['09:30', '11:00'][i], t: 'Recompra', who: a.name, what: `Compra cada ~${a.st.freqDays} días; van ${a.st.lastAgo}`, act: `<button type="button" class="m4-btn m4-btn--sm m4-btn--ghost" data-a="open-account" data-v="${a.id}">Ver ficha</button>` }));
    [['10:00', 'Visita', 'Hotel Boutique Isidora', 'Degustación y prueba de la máquina Bar'], ['12:30', 'Instalación', 'Café La Esquina Verde', 'Máquina Bar con Logística (demo)'], ['15:00', 'Llamada', 'Carolina Muñoz · Restaurante Mar Abierto', 'MQL 74 · pidió tazas con la marca'], ['17:00', 'Correo', 'Rodrigo Silva · Café Barrio Italia', 'Seguimiento de la guía para cafeterías']].forEach(([h, t, who, what]) => items.push({ h, t, who, what, act: '' }));
    return items.sort((a, b) => (a.live ? -1 : b.live ? 1 : a.h.localeCompare(b.h)));
  }
  function agendaToday(s, n = 99) {
    return `<ol class="m5-agenda">${agendaItems(s).slice(0, n).map((x) => `<li class="${x.live ? 'is-live' : ''}"><time>${esc(x.h)}</time><span class="m5-ag-type m5-ag-${x.t.toLowerCase()}">${esc(x.t)}</span><div><b>${esc(x.who)}</b><small>${esc(x.what)}</small></div>${x.act}</li>`).join('')}</ol>`;
  }
  function r10() {
    const s = M.get(); const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
    const week = days.map((d, i) => { const n = [5, 7, 4, 6, 3][i]; return `<li><b>${d}</b><span>${n} actividades</span><small>${['Ruta Oriente', 'Ruta Oriente · despacho', 'Visitas', 'Ruta Oriente · despacho', 'Seguimientos'][i]}</small></li>`; }).join('');
    return shell('R10', 'Agenda', `${liveCallBanner(s)}<div class="m4-grid-2 m4-grid-2--wide">${card('Hoy', agendaToday(s))}${card('Esta semana (demo)', `<ul class="m5-week">${week}</ul><p class="m4-fine">Llamadas, visitas, instalaciones y despachos de la Zona Oriente. Las rutas salen de Logística.</p>`)}</div>`, { sub: 'Llamadas, visitas, instalaciones y recompras de tu zona' });
  }

  // ---------- R03 · Mis clientes (Ventas) ----------
  function suggestFor(a) {
    const has = new Set(a.prods); const fit = D.lmFit(a.business);
    const prod = ['kom', 'roots', 'chai', 'rtd', 'mug', 'travel', 'onelove'].filter((p) => !has.has(p)).slice(0, 2).map((p) => D.PRODUCTS[p].name.replace(/ 227 g| 250 ml|Café Orgánico |Café /g, '').replace(/ \(.*\)/, ''));
    const svc = fit.ampl.filter((k) => D.SERVICES[k]).slice(0, 1).map((k) => D.SERVICES[k].t);
    return [...prod, ...svc];
  }
  function r03v5() {
    const s = M.get(); const rk = roleOf(s);
    if (ui.zone === 'todas' && rk === 'ventas' && !ui.zoneTouched) ui.zone = 'oriente';
    const tabs = [['clientes', 'Clientes con compras'], ['prospectos', 'Prospectos']].map(([k, l]) => `<button type="button" class="m4-seg ${ui.clientTab === k ? 'is-on' : ''}" data-a="client-tab" data-v="${k}" aria-pressed="${ui.clientTab === k}">${l}</button>`).join('');
    const zsel = `<label class="m4-inline-field"><span>Zona</span><select data-a="zone-filter"><option value="todas">Todas</option>${Object.values(D.ZONES).map((z) => `<option value="${z.id}" ${ui.zone === z.id ? 'selected' : ''}>${esc(z.name)}</option>`).join('')}</select></label>`;
    const inZone = (name) => ui.zone === 'todas' || zoneOfComuna(name)?.id === ui.zone;
    let table;
    if (ui.clientTab === 'clientes') {
      const rows = accounts().filter((a) => inZone(a.comuna)).sort((a, b) => (a.st.dueIn ?? 99) - (b.st.dueIn ?? 99)).map((a) => { const z = zoneOfComuna(a.comuna); const mk = MACH_BY_BIZ[a.business]; return `<tr data-a="open-account" data-v="${a.id}" tabindex="0"><td><b>${esc(a.name)}</b><small>${esc(a.business)} · máquina ${esc(D.MACHINES[mk].name)}</small></td><td>${esc(a.comuna)}<small>${esc(z ? z.route.split(' · ')[0] : '')}</small></td><td>${esc(D.PRODUCTS[a.st.top[0][0]].name.replace(/ 227 g| 250 ml|Café Orgánico /g, ''))}<small>${a.st.cats} categoría${a.st.cats === 1 ? '' : 's'}</small></td><td class="nw">Cada ~${a.st.freqDays} d<small>${a.st.dueIn !== null && a.st.dueIn <= 0 ? '<b class="m5-due">Le toca hoy</b>' : 'Próxima en ' + Math.max(0, a.st.dueIn) + ' d'}</small></td><td class="num">${D.fmtCLP(a.st.avg)}</td><td>${suggestFor(a).map((x) => `<span class="m4-chip">${esc(x)}</span>`).join(' ')}</td><td class="nw">${a.st.lastAgo === 0 ? 'Hoy' : 'Hace ' + a.st.lastAgo + ' d'}</td></tr>`; }).join('');
      table = `<div class="m4-table-wrap"><table class="m4-table m4-table--click"><thead><tr><th>Cliente y tipo de negocio</th><th>Dónde</th><th>Qué compra</th><th>Frecuencia</th><th class="num">Ticket*</th><th>Sugerir</th><th>Última compra</th></tr></thead><tbody>${rows}</tbody></table></div><p class="m4-fine">Ordenado por quién le toca comprar primero. * Montos ficticios. «Sugerir» = productos que aún no compra y el servicio que mejor calza con su negocio.</p>`;
    } else {
      const rows = leads().filter((l) => inZone(l.comuna)).sort((a, b) => b.score - a.score).map((l) => `<tr data-a="open-lead" data-v="${l.id}" tabindex="0"><td><b>${esc(l.name)}${l.live ? ' ' + chip('En vivo', 'live') : ''}</b><small>${esc(l.company)}</small></td><td>${esc(l.comuna)}</td><td>${esc(l.business)}<small>Máquina sugerida: ${esc(D.MACHINES[MACH_BY_BIZ[l.business] || 'bar'].name)}</small></td><td>${U.channelIcon(l.channel)} ${U.channelName(l.channel)}</td><td>${stageChip(l.stage)}</td><td><span class="m4-td-score">${bar(l.score)}<b>${l.score}</b></span></td></tr>`).join('');
      table = `<div class="m4-table-wrap"><table class="m4-table m4-table--click"><thead><tr><th>Contacto</th><th>Dónde</th><th>Negocio</th><th>Canal</th><th>Etapa</th><th>Puntaje</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    return shell('R03', 'Mis clientes', `<div class="m4-toolbar"><div class="m4-segs" role="group" aria-label="Lista">${tabs}</div>${zsel}</div>${card('', table)}`, { sub: 'Dónde está, qué compra, cada cuánto, cuánto y qué ofrecerle' });
  }

      rows.push(`<tr class="is-live"><td><b>${esc(s.lead.name || s.lead.id)}</b> ${chip('En vivo', 'live')}<small>${esc(s.answers.negocio || '')} · ${esc(s.answers.comuna || '')}</small></td><td>${esc(D.MACHINES[q.machine].name)}</td><td>${esc(MODE_TXT[q.mode] || q.mode)}</td><td class="num">${D.rangeTxt(e.monthly[0], e.monthly[1], true)}*</td><td>${s.proposal ? (s.proposal.status === 'aceptada' ? chip('Aceptada · ' + s.proposal.kind, 'ok') : quoteChip(s.proposal.status)) : quoteChip('cotizando')}</td></tr>`);

      const status = p && p.status === 'aceptada' ? `<p class="m4-ok">${icon('check', 16)} Aceptada por el cliente: ${esc(p.kind)}. Confirma precio real y fecha de instalación.</p>` : p && p.status === 'enviada' ? `<p class="m4-ok">${icon('send', 16)} Enviada ${U.ago(p.sentAt)}. El cliente la ve en su portal.</p>` : `<button type="button" class="m4-btn" data-a="send-proposal">${icon('send', 18)} Enviar propuesta sugerida</button>`;
      detail = card(`Cotización de ${esc(s.lead.name || s.lead.id)} ${quoteChip(p ? p.status : 'cotizando')}`, `<div class="m5-q-crm"><div class="m5-q-crm-m">${V5img(q.machine)}<div><b>${esc(m.name)}</b><small>${esc(m.kind)} · ${esc(MODE_TXT[q.mode] || q.mode)}</small></div></div>
<ul class="m4-kv"><li><span>Tazas al día</span><b>${q.cups}</b></li><li><span>Café al mes</span><b>${String(e.units).replace('.', ',')} ${e.unit} · ${D.rangeTxt(e.supply[0], e.supply[1], true)}*</b></li><li><span>${q.mode === 'arriendo' ? 'Arriendo mensual' : 'Compra directa'}</span><b>${q.mode === 'arriendo' ? D.rangeTxt(m.rent[0], m.rent[1], true) + '/mes*' : D.purchaseTxt(m)}</b></li><li><span>Total mensual</span><b>${D.rangeTxt(e.monthly[0], e.monthly[1], true)}*</b></li><li><span>Ampliada: servicios</span><b>${(q.services || []).map((k) => esc(D.SERVICES[k].t)).join(', ') || '—'}</b></li></ul>
<p class="m4-nba">${icon('truck', 18)} Logística: stock disponible para 2 semanas (demo). ${esc(z ? z.route : 'Ruta por confirmar')}.</p><div class="m4-actions">${status}</div><p class="m4-fine">* Rangos supuestos (académicos) a validar con Marley Coffee. La ejecutiva confirma precio real antes de enviar.</p></div>`);
    }

  }
  const V5img = (mk) => (M.MODE === 'wireframes' ? `<div class="m5-ph m5-ph--inline" style="width:96px;min-height:96px"><b>FOTO</b></div>` : `<img src="${D.MACHINES[mk].img}" alt="Máquina ${esc(D.MACHINES[mk].name)}" width="96" height="96" loading="lazy">`);

  // ---------- Marketing: R11 Flywheel e indicadores ----------
  function flywheelSVG(n) {
    const arc = (a0, a1, r) => { const p = (a) => [200 + r * Math.cos((a - 90) * Math.PI / 180), 200 + r * Math.sin((a - 90) * Math.PI / 180)]; const [x0, y0] = p(a0); const [x1, y1] = p(a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    // Arco al revés (antihorario) para que el texto de abajo no quede de cabeza.
    const rev = (a0, a1, r) => { const p = (a) => [200 + r * Math.cos((a - 90) * Math.PI / 180), 200 + r * Math.sin((a - 90) * Math.PI / 180)]; const [x0, y0] = p(a1); const [x1, y1] = p(a0); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
    const seg = [['ATRAER', 4, 116, '#f7be00', '#0d0d0d', n.atraer], ['INTERACTUAR', 124, 236, '#3f3f40', '#fff', n.inter], ['DELEITAR', 244, 356, '#5e7e29', '#fff', n.deleitar]];
    return `<svg class="m5-fly" viewBox="-20 -20 440 440" role="img" aria-label="Flywheel: atraer ${n.atraer}, interactuar ${n.inter}, deleitar ${n.deleitar}"><defs><marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0d0d0d"/></marker></defs>${seg.map(([t, a0, a1, c, tc, v], i) => { const mid = (a0 + a1) / 2; const low = mid > 90 && mid < 270; const lab = (r) => (low ? rev(a0 + 3, a1 - 3, r) : arc(a0 + 3, a1 - 3, r)); return `<path d="${arc(a0, a1, 128)}" stroke="${c}" stroke-width="62" fill="none"/><path d="${arc(a1 - 2, a1 + 6, 172)}" stroke="#0d0d0d" stroke-width="3" fill="none" marker-end="url(#fa)"/><path id="fly${i}a" d="${lab(low ? 124 : 134)}" fill="none"/><path id="fly${i}b" d="${lab(low ? 146 : 112)}" fill="none"/><text class="t1" fill="${tc}"><textPath href="#fly${i}a" startOffset="50%" text-anchor="middle">${t}</textPath></text><text class="t2" fill="${tc}"><textPath href="#fly${i}b" startOffset="50%" text-anchor="middle">${v}</textPath></text>`; }).join('')}<circle cx="200" cy="200" r="70" fill="#0d0d0d"/><text x="200" y="196" text-anchor="middle" class="t1" fill="#f7be00">CLIENTE</text><text x="200" y="216" text-anchor="middle" class="t3" fill="#ddd">al centro</text></svg>`;
  }
  function r11() {
    const s = M.get(); const ls = leads(); const accs = accounts(); const mql = ls.filter((l) => l.stage === 'MQL').length; const sql = ls.filter((l) => l.stage === 'SQL').length;
    const active = accs.filter((a) => a.st.in90 > 0).length; const refs = accs.filter((a) => a.lm.LM7).length; const lm5 = accs.filter((a) => a.lm.LM5).length;
    const bySource = {}; ls.forEach((l) => { const k = l.source.replace(/ \(.*\)/, ''); bySource[k] = (bySource[k] || 0) + 1; }); const max = Math.max(...Object.values(bySource));
    const reach = LM_LEAD.map((id) => [id, ls.filter((l) => lmLead(l)[LM_LEAD.indexOf(id)][1]).length]);
    const drops = reach.slice(1).map(([id, v], i) => [reach[i][0], id, reach[i][1] - v]).sort((a, b) => b[2] - a[2]); const d0 = drops[0];

    return shell('R11', 'Flywheel e indicadores', `${emptyLive()}<div class="m4-grid-2 m4-grid-2--wide">${card('Flywheel de Marley Coffee Empresas', `<div class="m5-fly-wrap">${fly}${stages}</div>`)}
${card('Contactos por origen (campañas y fuentes)', `<ul class="m4-hbars">${Object.entries(bySource).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><span>${esc(k)}</span>${bar((v / max) * 100)}<b>${v}</b></li>`).join('')}</ul><p class="m4-fine">Origen guardado con UTM al primer clic (GA4 + CRM).</p>`)}</div>
${card('Lead magnets · cuántos llegan a cada uno', `<ul class="m4-hbars">${reach.map(([id, v]) => `<li><span>${id} · ${esc(D.LM[id].name)}</span>${bar((v / ls.length) * 100)}<b>${v}</b></li>`).join('')}</ul><p class="m4-nba">${icon('spark', 18)} ¿Qué decidir? La caída más grande está entre ${d0[0]} y ${d0[1]} (${d0[2]} contactos): probar un lead magnet más claro en esa pantalla.</p>`, `<button type="button" class="m4-link-btn" data-go="R13">Contenido por segmento</button>`)}`, { sub: 'Atraer, interactuar y deleitar: el embudo vive dentro del ciclo' });
  }

  function r12() {
    const s = M.get(); const f = ui.leadFilter || 'todos';
    const ls = leads(s).filter((l) => f === 'todos' || l.stage === f).sort((a, b) => b.score - a.score);
    const segs = [['todos', 'Todos'], ['Lead', 'Contactos'], ['MQL', 'MQL'], ['SQL', 'SQL']].map(([k, l]) => `<button type="button" class="m4-seg ${f === k ? 'is-on' : ''}" data-a="lead-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`).join('');
    const rows = ls.map((l) => { const lm = lmLead(l).filter(([, on]) => on).length; return `<tr data-a="open-lead" data-v="${l.id}" tabindex="0"><td><b>${esc(l.name)}${l.live ? ' ' + chip('En vivo', 'live') : ''}</b><small>${esc(l.company)}</small></td><td>${esc(l.business)}<small>${esc(l.comuna)}</small></td><td><span class="m4-td-score">${bar(l.score)}<b>${l.score}</b></span><small>${esc(M.band(l.score).name)}</small></td><td>${stageChip(l.stage)}</td><td>${lm} de 4<small>${lmLead(l).filter(([, on]) => on).map(([id]) => id).join(' · ')}</small></td><td>${esc(l.source)}</td></tr>`; }).join('');
    return shell('R12', 'Leads y puntajes', `${emptyLive()}<div class="m4-kpis">${kpi('Contactos', leads(s).length)}${kpi('MQL', leads(s).filter((l) => l.stage === 'MQL').length, 'Calificados por marketing')}${kpi('SQL', leads(s).filter((l) => l.stage === 'SQL').length, 'Aceptados por ventas')}${kpi('Puntaje promedio', Math.round(leads(s).reduce((a, l) => a + l.score, 0) / leads(s).length))}</div>
<div class="m4-toolbar"><div class="m4-segs" role="group" aria-label="Etapa">${segs}</div></div>${card('', `<div class="m4-table-wrap"><table class="m4-table m4-table--click"><thead><tr><th>Contacto</th><th>Negocio y comuna</th><th>Puntaje</th><th>Etapa</th><th>Lead magnets</th><th>Origen</th></tr></thead><tbody>${rows}</tbody></table></div><p class="m4-fine">Engagement v1.1: 13 eventos + comuna. MQL = permiso + negocio HORECA + 40 puntos. SQL lo acepta una persona.</p>`)}`, { sub: 'Puntajes, interacciones y etapa de cada contacto' });

  function r13() {

    const matrix = [['Atraer', 'Página Empresas por negocio y clip para redes', 'LM1 · Orientación', 'Búsqueda, SEM por intención, redes', 'Visita con UTM → origen', 'K01'], ['Atraer', sc.explora, 'LM1', 'Sitio Empresas (C02 y C08)', '«Ver mi solución» (+10)', 'K01, K03'], ['Interactuar', 'Correo de bienvenida con N.º de seguimiento', 'LM2 · Avance', 'Correo', 'W1 al dejar correo con permiso', 'K02'], ['Interactuar', `Solución preliminar: máquina ${D.MACHINES[B.machine].name} y consumo estimado`, 'LM3 · Configuración', 'Portal y correo', 'W2 al responder; W4 a las 24 h', 'K03, K07'], ['Interactuar', `Propuesta ampliada con ${fit.ampl.map((k) => D.SERVICES[k].t.toLowerCase()).slice(0, 2).join(' y ')}`, 'LM4 · Ampliación', 'Portal, teléfono', 'W3 al elegir canal; W6 pausa al responder', 'K04, K05'], ['Deleitar', 'Aviso de reposición y catálogo de servicios', 'LM5 · LM6', 'Mi cuenta y correo', 'W7 según su frecuencia', 'K11, K12'], ['Deleitar', 'Invitación con código y beneficio experiencial', 'LM7 · Referido', 'Mi cuenta', 'W8 cliente frecuente sin incidencia', 'K15']];
    const leadsNext = leads().filter((l) => l.business === seg || seg === 'Hotel' && l.live).slice(0, 5).map((l) => `<li>${avatar(l.name)}<div><b>${esc(l.name)}</b><small>${esc(l.stage)} · ${l.score} pts</small></div><span>${esc(l.stage === 'SQL' ? 'Caso en video + ampliada' : l.stage === 'MQL' ? sc.explora : sc.nutre)}</span><button type="button" class="m4-btn m4-btn--sm m4-btn--ghost" data-a="toast" data-v="Pieza aprobada para ${esc(l.name)} (demo)">Aprobar</button></li>`).join('');

${card(`Matriz de contenido · ${esc(seg)}`, `<div class="m4-table-wrap"><table class="m4-table"><thead><tr><th>Flywheel</th><th>Pieza</th><th>Lead magnet</th><th>Canal</th><th>Gatillador</th><th>KPI</th></tr></thead><tbody>${matrix.map((r) => `<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${r[5]}</td></tr>`).join('')}</tbody></table></div>`)}

  const BASE = { R00: r00, R01: r01, R02: r02, R03: r03v5, R04: r04v5, R05: r05, R06: r06, R07: r07, R08: r08v5, R09: r09, R10: r10, R11: r11, R12: r12, R13: r13, R14: r14, R15: r15 };
  // Entrada por rol y control de acceso: sin sesión se muestra el ingreso de trabajadores; las métricas generales son solo de jefatura.
  const SCREENS = Object.fromEntries(Object.entries(BASE).map(([id, fn]) => [id, () => {

  return { SCREENS, ui, ROLES, DEMO_USERS, leads, accounts, convs, aiReply, quoted };
})();

    C03: { t: 'Tus datos (al principio)', obj: 'Antes del diagnóstico: nombre, correo y WhatsApp con «+56 9» ya escrito, y permiso. Con esos datos se guarda el avance y, si la persona abandona, se la puede recuperar (correo a las 24 h y audiencia de remarketing con permiso). Un solo botón «Guardar y seguir»: si no escribe nada, sigue igual y los datos se le piden al aceptar o al pedir una ejecutiva.', tarea: 'T1', ev: 'Test 15-10: el formulario fue la pantalla más lenta (44 a 50 s), por eso v6.1 lo deja corto: 3 datos, +56 9 escrito, autocompletar y la comuna pasa al paso 2. Carlitos (15-10): «si alguien abandona no tenemos cómo recuperarlo, por eso dije que debía ir al principio».', dat: 'Correo + permiso = formulario 1 (+20) y correo con el N.º de seguimiento (W1); si no termina, aviso de abandono a las 24 h (W4). Al cerrar: aceptar (+15) o pedir persona (canal +3, ejecutivo +12).', ag: 'Calificación y Marketing (W1 y W4).', sig: 'C04', lm: 'LM2 · Avance, arriba del formulario: tu N.º de seguimiento y tu propuesta en tu correo; si te interrumpen, retomas donde quedaste.' },
    C04: { t: 'Tu negocio en 3 pasos', obj: 'Tres pasos que se marcan, no se escriben: (1) negocio, que se salta si ya lo eligió; (2) comuna y tazas al día en la misma pantalla; (3) cómo sirve y qué quiere ofrecer, ya marcados según su negocio, con «Todas». Al avanzar, la pantalla sube al inicio.', tarea: 'T2', ev: 'Test 15-10: las 5 preguntas tomaron 33 a 39 s; P1 y P2 marcaron las bebidas una por una (13 a 14 toques); P2: «podría haber sido más resumida» y «faltaba un botón que seleccionara todo»; en celular la vista no subía al pasar de pregunta. Carlitos: «que no todo se vea como una pregunta, sino cosas que se seleccionan».', dat: 'Diagnóstico +5, negocio +4, comuna +2 a +10, volumen +5, operación +4, preferencias +4 (mismos eventos de la tabla M2).', ag: 'Calificación, Orquestador (zona) y Logística (ruta).', sig: 'C05', lm: 'LM3 · Configuración: al terminar ve su propuesta al instante, sin dejar datos.' },
    C05: { t: 'Tu propuesta (lista al instante)', obj: 'El agente de ventas arma la propuesta apenas termina el diagnóstico: máquina sugerida, arriendo o compra directa elegible ahí mismo, café al mes y precio mensual grande y en color. Botón principal «Aceptar mi propuesta»; «Hablar con una ejecutiva» y «Ajustar detalles» quedan como opcionales. Los extras van como «Recomendado para tu negocio», apagados.', tarea: 'T3', ev: 'Test 15-10: P1 y P3 querían elegir la modalidad y los extras antes de la propuesta; P2 no supo qué venía después; P3 sintió como pérdida de tiempo esperar una «nueva propuesta» y no veía los precios. Carlitos: «que el cliente vea al tiro que está listo y aceptar» y el cross-selling como recomendación, no impuesto.', dat: 'Revisa su propuesta = recomendación (+8). Modalidad y extras se guardan al instante en la propuesta (el CRM lo ve en vivo). Precios: supuestos académicos rotulados.', ag: 'Ventas (IA) y Logística (stock y ruta).', sig: 'C03 · C07', lm: 'LM3 entregado y LM4 · extras recomendados para su negocio.' },
    C06: { t: '¡Listo! y Mi portal', obj: 'Al aceptar: confirmación grande con quién le escribe, por dónde, cuándo (horario hábil rotulado) y los 3 pasos que siguen. Si pidió hablar: estado del chat, la llamada o el correo, la propuesta para aceptar y la conversación. 4 etapas simples (antes 5).', tarea: 'T3, T4', ev: 'Test 15-10: P2 «se perdió en qué hacer» al terminar; la lección del 13-10 dice que demasiadas fases después del diagnóstico confunden.', dat: 'Entrar al portal (+8). Mensajes, llamada (ficha y siguiente paso) y propuesta enviada por la ejecutiva.', ag: 'Bot, Ventas y Logística.', sig: 'C09', lm: 'LM2 cumplido: resumen y N.º de seguimiento por correo.' },
    C07: { t: 'Ajustar la propuesta (opcional)', obj: 'Los cambios se aplican al instante, sin esperar una nueva propuesta: primero la máquina sugerida y las otras a un toque, modalidad, tazas y días, y extras recomendados. El precio mensual va grande arriba del resumen; el botón principal es «Aceptar mi propuesta».', tarea: 'T5', ev: 'Test 15-10: C07 fue la pantalla más larga de P3 (57,3 s) y la espera de «nueva propuesta» se sintió inútil. Rangos supuestos (pedido de Carlitos 12-10) rotulados; referencia pública real de bolsas 227 g (API VTEX).', dat: 'Propuesta (+15) y ampliada con extras (+12). La cotización vive en el estado compartido: el CRM la ve en vivo.', ag: 'Ventas y Logística.', sig: 'C03 · C06', lm: 'LM4 · los extras que marca entran como ampliada.' },
    C08: { t: 'Casos: experiencia con scroll', obj: 'Una sola escena al scroll con pestañas por negocio (hotel, restaurante, cafetería, evento): el video avanza al bajar y retrocede al subir; el copy y el CTA entran por tramos.', tarea: 'Apoyo a T1', ev: 'Revisión del 12-10 con Carlitos: 5 escenas seguidas cansaban más de lo que sorprendían; máximo 2 por pantalla. Video al lado del copy, borde difuminado, 2 pantallas de scroll (antes 3) y suavizado.', dat: 'CTA por escena entra con el negocio elegido.', ag: 'Marketing.', sig: 'C04', lm: 'LM1 en la banda final.' },
    C09: { t: 'Mi cuenta (cliente activo)', obj: 'Repetir el pedido en un toque, aviso de reposición, máquina instalada y servicios para escalar con foto y rango.', tarea: 'T6', ev: '82 %* de las reposiciones hoy pasan por ejecutivo, correo o mensajería.', dat: 'Reposición, aviso, solicitud de servicio y referido.', ag: 'Postventa y Logística.', sig: '—', lm: 'LM5 · Reposición, LM6 · Expansión y LM7 · Referido.' },
    R00: { t: 'Ingreso de trabajadores', obj: 'Usuario y contraseña (o cuenta corporativa) y cuentas de demostración de un toque. El usuario se acepta con mayúsculas, tildes, espacios o dominio, y el celular no cambia la primera letra. Si falla, el error sugiere la cuenta correcta.', tarea: 'T7 · T9', ev: 'Test 15-10: P5 (jefatura, celular) escribió su usuario y tocó «Ingresar» dos veces sin entrar (24 s); entró con la tarjeta de demostración.', dat: 'Usuario, rol activo y sesión en el estado.', ag: '—', sig: 'R01 · R11 · R05' },
    R01: { t: 'Ventas · Mi día', obj: 'La siguiente tarea destacada arriba («Elena te espera en el chat», con lo que cotizó) y los indicadores del día, que se tocan y llevan a su lista.', tarea: 'T7', ev: 'H01/H02: el contacto llegaba sin contexto ni prioridad. Test 15-10: toda tarjeta con aspecto de botón debe responder (58 % de los toques del CRM cayeron en algo que no respondía).', dat: 'Cola por canal, cotizaciones abiertas, agenda y frecuencia de compra.', ag: 'Orquestador y Postventa.', sig: 'R02' },
    R02: { t: 'Ventas · Conversaciones y llamadas', obj: 'Chat grande; arriba, la tarjeta del agente de ventas (IA): «Este cliente cotizó esto; esta es la propuesta que deberías darle», con «Enviar propuesta sugerida» como botón principal. Al costado, «Lo que cotizó el cliente» en vivo. Guía de 3 pasos que se cierra. Botones de 44 px, separados y con jerarquía.', tarea: 'T7', ev: 'Test 15-10: P4 no logró la tarea (facilidad 2/7, SUS 27,5): «no salían los productos que cotizó, ni la propuesta sugerida»; chat «demasiado pequeño»; pidió un mini tutorial; toques perdidos entre «Llamar» y «Preparar propuesta». Carlitos: la IA hace el primer tramo y la ejecutiva cierra y resuelve dudas.', dat: 'Propuesta y cotización en vivo, respuesta sugerida, call.ficha, call.notes, resultado y siguiente paso.', ag: 'Ventas (IA), Orquestador y bot.', sig: 'R08', lm: 'Contexto del cliente con los lead magnets recibidos.' },
    R03: { t: 'Ventas · Mis clientes', obj: 'Dónde está, qué compra, tipo de negocio, frecuencia, ticket, qué sugerir y última compra; ordenado por a quién le toca comprar.', tarea: 'T8', ev: 'Pedido de Carlitos (12-10): datos de compra al frente para vender.', dat: 'Historial de pedidos de demostración.', ag: 'Postventa.', sig: 'R04' },
    R04: { t: 'Ficha del cliente (según rol)', obj: 'Contacto en vivo: lo que cotizó y la propuesta sugerida arriba. Ventas: dónde, compras, máquina, productos a sugerir y próxima acción. Marketing: puntaje, interacciones, lead magnets y contenido sugerido. Los indicadores llevan a su detalle.', tarea: 'T8', ev: 'H05: el CRM actual tiene 40 %* de fichas completas. Test 15-10: P4 fue dos veces a la ficha a buscar lo cotizado y tocó 5 veces la tarjeta del cliente.', dat: 'Financial Score v0.1 y Engagement v1.1.', ag: 'Ventas (IA), Postventa y Marketing.', sig: 'R02', lm: 'LM1–LM4 (prospecto) y LM5–LM7 (cliente).' },
    R05: { t: 'Jefatura · Panel general', obj: 'Filtros por período (7, 30 y 90 días) y zona. 3 indicadores principales grandes (clientes que compran, SQL y ventas) con color según su tendencia; al tocarlos se ve el detalle. Los demás indicadores en gris. Gráficos, cruces por zona y tipo de cliente y lo que hicieron los agentes, también en el celular.', tarea: 'T9', ev: 'Test 15-10: P5 tocó 10 indicadores en 11 s buscando detalle («carecía de funciones para interactuar, cruzar datos o ver datos más específicos»); todas las tarjetas tenían el mismo color. Carlitos: en celular se perdían los gráficos, los cruces y lo que hacía cada agente.', dat: 'Pedidos de demostración por período y zona; color = comparación con el período anterior (sin metas inventadas); líneas base del caso con asterisco; NRR por levantar.', ag: 'Todos (resumen de su actividad).', sig: 'R06 · R07' },
    R06: { t: 'Mapa por zonas', obj: 'Los dos puntajes por comuna, con prioridad y ejecutiva.', tarea: 'T9', ev: 'H03 (geografía).', dat: 'Promedio de Engagement o Financial por comuna.', ag: '—', sig: 'R04' },
    R07: { t: 'Agentes y aprobaciones', obj: 'Red de agentes, llamadas a los sistemas de Marley Coffee (VTEX, ERP, pagos, despacho) y decisiones que esperan a una persona.', tarea: '—', ev: 'Capa agéntica en la cadena de valor (pedido del 10-10).', dat: 'Mensajes con origen, destino, acción y endpoint.', ag: 'Todos.', sig: '—', lm: 'LM6 y LM7 esperan la decisión de una persona.' },
    R08: { t: 'Ventas · Cotizaciones', obj: 'La cotización en vivo es la misma propuesta que ve el cliente (con sus ajustes); la ejecutiva la envía confirmada o ve que ya la aceptó. Lista de cotizaciones con su estado.', tarea: 'Apoyo a T5', ev: 'Test 15-10 (P4): la propuesta sugerida debía estar a mano.', dat: 'Propuesta con máquina, modalidad, café y extras; llega a C05 y C06.', ag: 'Ventas (IA) y Logística.', sig: 'C05' },
    R09: { t: 'Reglas de puntaje', obj: 'Respaldo de los dos puntajes con geografía y tabla LM1–LM7.', tarea: '—', ev: 'Tabla M2 + ajuste geográfico del 10-10.', dat: 'Pesos, bandas y prioridades de zona.', ag: 'Calificación.', sig: '—' },
    R10: { t: 'Ventas · Agenda', obj: 'Hoy y la semana: llamadas (incluida la que pidió el cliente), visitas, instalaciones y recompras de la zona.', tarea: '—', ev: 'Referencia de orden: Calendly (una idea por bloque).', dat: 'Llamadas agendadas y frecuencia de compra.', ag: 'Orquestador y Postventa.', sig: 'R02' },
    R11: { t: 'Marketing · Flywheel e indicadores', obj: 'El embudo vive dentro del ciclo atraer → interactuar → deleitar; contactos por origen y alcance de cada lead magnet.', tarea: '—', ev: 'Corrección del 12-10: el inbound es un flywheel con el embudo adentro, no solo un embudo.', dat: 'Origen (UTM), MQL, SQL, clientes activos, avisos y referidos.', ag: 'Marketing.', sig: 'R12', lm: 'Caída entre lead magnets = qué pantalla mejorar.' },
    R12: { t: 'Marketing · Leads y puntajes', obj: 'Cada contacto con puntaje, banda, etapa, lead magnets recibidos y origen.', tarea: '—', ev: 'MQL = permiso + HORECA + 40 puntos; SQL lo acepta una persona.', dat: 'Engagement v1.1.', ag: 'Calificación.', sig: 'R04' },
    R13: { t: 'Marketing · Contenido personalizado', obj: 'Matriz por segmento y etapa del flywheel: pieza, lead magnet, canal, gatillador y KPI; vista previa del correo W10 y pieza sugerida por contacto.', tarea: '—', ev: 'Contenido segmentado pedido el 10-10 (blueprint inbound).', dat: 'Segmento × etapa.', ag: 'Marketing.', sig: 'R12' },
    R14: { t: 'Jefatura · Equipo y tiempos', obj: 'Carga y tiempos de respuesta por persona para balancear, en orden alfabético (no ranking).', tarea: '—', ev: 'H06.', dat: 'Conversaciones activas, espera y primera respuesta (demo).', ag: 'Orquestador (reasigna).', sig: 'R07' },
    R15: { t: 'Jefatura · Operación', obj: 'Despachos por ruta, OTIF, parque de máquinas, mantenciones y tickets técnicos.', tarea: '—', ev: 'OTIF 92 %* y tickets sin conexión al CRM (caso).', dat: 'Líneas base del caso y demo.', ag: 'Logística y Postventa.', sig: 'R07' },
    R16: { t: 'Conexiones y actividad omnicanal', obj: 'Muestra en una sola vista y en el espejo paralelo cómo cada acción del cliente en el sitio B2B impacta en vivo a Marketing (atribución, lead magnets, workflows W1–W10 y puntaje de interacción), Ventas (asignación por comuna, propuesta IA y traspaso de chat/WhatsApp), Operación (stock, ruta y pausa de campañas por incidencia) y Jefatura (KPIs y compuertas de aprobación humana).', tarea: 'Recorrido paralelo Sitio ↔ CRM', ev: 'Pedido de diseño omnicanal: relacionar en vivo lo que ocurre en el frente B2B del cliente con los canales internos del CRM para evidenciar la automatización y la capa agéntica.', dat: 'Eventos M2, bandeja local de correos, estado M7 de conversación y conectores API propuestos.', ag: 'Orquestador, Marketing, Calificación, Ventas, Logística y Postventa.', sig: 'C02 · R02 · R12 · R05' }
  };
  const KEY = 'm4notes';
  const isOpen = () => { try { const v = sessionStorage.getItem(KEY); if (v !== null) return v === '1'; } catch (_) { /* nada */ } return M.MODE === 'wireframes' && innerWidth >= 1100; };
  const setOpen = (v) => { try { sessionStorage.setItem(KEY, v ? '1' : '0'); } catch (_) { /* nada */ } };
  function paint(id) {
    let el = document.getElementById('m4-notes');
    const n = N[id];
    const open = isOpen() && n && !M.TEST;
    document.body.classList.toggle('m4-notes-open', Boolean(open));
    document.querySelectorAll('[data-a="notes"]').forEach((b) => b.setAttribute('aria-pressed', String(Boolean(open))));
    if (!open) { if (el) el.hidden = true; return; }
    if (!el) { el = document.createElement('aside'); el.id = 'm4-notes'; el.setAttribute('aria-label', 'Anotaciones UX'); document.body.appendChild(el); }
    el.hidden = false;
    const row = (k, v) => `<div class="m4-note-row"><b>${k}</b><p>${esc(v)}</p></div>`;
    el.innerHTML = `<div class="m4-notes-head"><span>${id} · anotación UX</span><button type="button" data-a="notes" aria-label="Cerrar anotaciones">×</button></div><h2>${esc(n.t)}</h2>${row('Objetivo', n.obj)}${row('Tarea crítica', n.tarea)}${row('Por qué (evidencia)', n.ev)}${n.lm ? row('Lead magnet', n.lm) : ''}${row('Datos y eventos', n.dat)}${row('Agentes', n.ag)}${row('Siguiente', n.sig)}<p class="m4-notes-foot">* Base académica del caso. H = hallazgo del ciclo 0 (Anexo E, hoja 10). T = tarea del recorrido de diseño; el test mide una sola tarea por participante (T1 en el sitio, T7 o T9 en el CRM). LM = lead magnet (rótulo amarillo en pantalla).</p>`;
  }
  function toggle(id) { setOpen(!isOpen()); paint(id); }
  return { N, paint, toggle };
})();

</script><script>
/* Marley Coffee Empresas · v4 · enrutador, acciones, avisos y barra de evaluación.
   El legado solo dibuja C01 (inicio B2C oficial); todo lo demás lo dibuja esta capa. */
window.MarleyApp = (() => {
  const M = window.M4; const U = window.M4UI; const C = window.M4C; const R = window.M4R; const D = window.M4D;
  const { esc, icon } = U;
  // v6.1 (15-10): C02 Empresas · C03 Tus datos (al principio: recuperar a quien abandona) · C04 Tu negocio (3 pasos) ·
  // C05 Tu propuesta (al instante) · C06 ¡Listo! / Mi portal · C07 Ajustar (opcional). Los códigos de pantalla no cambian.
  const NAMES = {
    C01: 'Inicio Marley Coffee (B2C oficial)', C02: 'Empresas (máquinas primero)', C03: 'Tus datos (al principio)', C04: 'Tu negocio (3 pasos)', C05: 'Tu propuesta (lista al instante)', C06: 'Confirmación y seguimiento por correo', C07: 'Ajustar la propuesta (opcional)', C08: 'Casos (experiencia con scroll)', C09: 'Mi cuenta (cliente activo)',
    R16: 'Conexiones y actividad omnicanal', R00: 'Ingreso de trabajadores', R01: 'Ventas · Mi día', R02: 'Ventas · Conversaciones y llamadas', R03: 'Ventas · Mis clientes', R04: 'Ficha del cliente', R08: 'Ventas · Cotizaciones', R10: 'Ventas · Agenda',
    R11: 'Marketing · Flywheel e indicadores', R12: 'Marketing · Leads y puntajes', R13: 'Marketing · Contenido personalizado', R06: 'Marketing y jefatura · Mapa por zonas', R09: 'Reglas de puntaje',
    R05: 'Jefatura · Panel general', R14: 'Jefatura · Equipo y tiempos', R15: 'Jefatura · Operación', R07: 'Jefatura · Agentes y aprobaciones'
  };
  const app = () => document.getElementById('app');
  const hashId = () => (location.hash || '#C01').slice(1).split('?')[0];
  // En los prototipos de test cada archivo muestra solo su parte: el sitio (C) o el CRM (R).
  const allowed = (id) => (M.TEST === 'sitio' ? id[0] === 'C' : M.TEST === 'crm' ? id[0] === 'R' : true);
  const handles = () => { const id = hashId(); if (!allowed(id) && M.TEST) { location.replace('#' + (M.TEST === 'crm' ? 'R01' : 'C01')); return M.TEST === 'crm'; } return Boolean(C.SCREENS[id] || R.SCREENS[id]); };
  const isCRM = (id) => id.startsWith('R');
  const crmHome = () => { const r = M.get().role; return D.ROLE_MENUS && D.ROLE_MENUS[r] ? D.ROLE_MENUS[r].home : 'R00'; };
  let lastRoute = null; let rendering = false; let pending = false; let enterT = 0;

  // ---------- Vista celular (15-10, Carlitos: «dame la posibilidad de ver todo en versión mobile») ----------
  // El mismo archivo se abre dentro de una pantalla de 390 × 844 (la de un teléfono), escalada para que entre completa en la
  // ventana. Adentro corre igual que en un celular (menú, botones y pantallas de celular) y la barra de evaluación se oculta.
  const EN_MARCO = new URLSearchParams(location.search).has('movil');
  if (EN_MARCO) document.documentElement.classList.add('m6-en-marco');
  const screenOptions = (id) => [['Sitio del cliente', Object.keys(NAMES).filter((k) => k[0] === 'C')], ['CRM interno', Object.keys(NAMES).filter((k) => k[0] === 'R')]].map(([g, ids]) => `<optgroup label="${g}">${ids.map((k) => `<option value="${k}" ${k === id ? 'selected' : ''}>${k} · ${esc(NAMES[k])}</option>`).join('')}</optgroup>`).join('');
  function movilAbrir() {
    if (document.getElementById('m6-movil')) return;
    const id = hashId(); const src = (h) => `${location.pathname}?movil=1#${h}`;
    const kind = M.MODE === 'prototype' ? 'del prototipo' : M.MODE === 'mockups' ? 'del mockup' : 'del wireframe';
    const w = document.createElement('div'); w.id = 'm6-movil'; w.className = 'm6-movil'; w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', 'Vista celular');
    w.innerHTML = `<div class="m6-movil-top"><b>Vista celular</b><span>390 × 844 · se toca con el mouse como en un teléfono</span><label>Ir a <select aria-label="Ir a una pantalla en la vista celular">${screenOptions(id)}</select></label><button type="button" class="m4-strip-btn m4-strip-btn--hl" data-movil-close>Volver a escritorio</button></div><div class="m6-movil-caja"><div class="m6-movil-alto"><div class="m6-movil-fono"><iframe title="Vista celular ${kind}" src="${src(id)}"></iframe></div></div></div>`;
    document.body.appendChild(w); document.body.classList.add('m6-movil-on');
    const caja = w.querySelector('.m6-movil-caja'); const alto = w.querySelector('.m6-movil-alto'); const fono = w.querySelector('.m6-movil-fono'); const ifr = w.querySelector('iframe');
    const fit = () => { const k = Math.min(1, (caja.clientHeight - 16) / 864, (caja.clientWidth - 16) / 410); alto.style.width = `${Math.round(410 * k)}px`; alto.style.height = `${Math.round(864 * k)}px`; fono.style.transform = `scale(${k})`; };
    fit(); addEventListener('resize', fit); w.m6fit = fit;
    w.querySelector('select').addEventListener('change', (ev) => { ifr.src = src(ev.target.value); });
    w.querySelector('[data-movil-close]').addEventListener('click', movilCerrar);
    const btn = w.querySelector('[data-movil-close]'); if (btn) btn.focus();
  }
  function movilCerrar() { const w = document.getElementById('m6-movil'); if (!w) return; removeEventListener('resize', w.m6fit); w.remove(); document.body.classList.remove('m6-movil-on'); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('m6-movil')) movilCerrar(); }, true);
  // Con el foco adentro del teléfono, el Esc lo recibe el marco: le avisa a la ventana de afuera para que cierre la vista.
  if (EN_MARCO) document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { try { parent.postMessage({ m6: 'cerrar-movil' }, '*'); } catch (_) { /* sin ventana de afuera */ } } }, true);
  addEventListener('message', (e) => { if (e.data && e.data.m6 === 'cerrar-movil') movilCerrar(); });

  function strip(id) {
    if (M.TEST || EN_MARCO) return '';
    const groups = [['Sitio del cliente', Object.keys(NAMES).filter((k) => k[0] === 'C')], ['CRM interno', Object.keys(NAMES).filter((k) => k[0] === 'R')]];
    const sel = `<label class="m4-strip-go"><span>Ir a</span><select data-a="goto" aria-label="Ir a una pantalla">${groups.map(([g, ids]) => `<optgroup label="${g}">${ids.map((k) => `<option value="${k}" ${k === id ? 'selected' : ''}>${k} · ${esc(NAMES[k])}</option>`).join('')}</optgroup>`).join('')}</select></label>`;
    const mode = M.MODE === 'prototype' ? 'Prototipo' : M.MODE === 'mockups' ? 'Mockup' : 'Wireframe';
    const proto = M.MODE === 'prototype' ? `<button type="button" class="m4-strip-btn" data-a="load-example">Caso de ejemplo</button><button type="button" class="m4-strip-btn m4-strip-btn--test" data-a="start-test" title="Abre el test de usabilidad con grabación, tiempos, mapa de calor y notas del observador">● Iniciar test</button><label class="m4-strip-check"><input type="checkbox" data-a="autopilot" ${M.get().autopilot ? 'checked' : ''}><span>Ejecutiva simulada</span></label>` : '';

  // Conserva lo que el usuario está haciendo cuando la pantalla se vuelve a dibujar por un cambio de estado.

  function load() {

    if(!M.STATIC)try{const r=JSON.parse(localStorage.getItem(k)||'null');if(r?.v===VERSION && r.scope===scope() && Array.isArray(r.messages) && Array.isArray(r.operations)){state=Object.assign(fresh(),r);state.messages=r.messages.filter(m=>m && ['ia','cliente','equipo','sistema'].includes(m.author) && Number.isFinite(m.at)).slice(-100).map(m=>({...m,text:clean(m.text)}));state.audit=Array.isArray(r.audit)?r.audit.slice(-50):[];state.effects=[];if(!statusLabels[state.status])state.status='asistente';state.service=false;state.marketing=false;state.stopped=true;}}catch(_){}

    if(s.draft)out+=`<section class="m7-card"><h3>Revisa la reposición</h3><p>${esc(s.draft.product)}</p><label>Cantidad de unidades <input id="m7-quantity" type="number" min="1" max="50" value="${s.draft.qty}" data-m7-qty ${op?'disabled':''}></label><p>Solicitud de ejemplo. Precio, disponibilidad y despacho por confirmar; sin cobro.</p>${!op?btn('reorder-confirm','Confirmar solicitud',true,s.paused||Boolean(s.failed))+btn('failure','Simular fallo'):''}</section>`;
    if(s.order)out+=`<section class="m7-card"><h3>Pedido de demostración</h3><p>${esc(s.order.id)} · ${esc(s.order.status)}</p></section>`;
    if(s.closePending)out+=`<section class="m7-card"><h3>¿Quedó resuelto tu caso?</h3><p>Las ofertas siguen pausadas hasta tu confirmación.</p>${!op?btn('close-confirm','Sí, quedó resuelto',true)+btn('reopen','Todavía necesito ayuda'):''}</section>`;
    if(s.status==='cerrado' && !op)out+=`<section class="m7-card"><h3>¿Cómo fue la atención?</h3>${['buena','regular','mala'].map(v=>btn('rating',v[0].toUpperCase()+v.slice(1),false,Boolean(s.rating),`data-value="${v}"`)).join('')}${btn('reopen','Reabrir el caso de soporte')}</section>`;
    if(s.failed)out+=`<p class="m7-card m7-card--alert" role="alert">${esc(s.failed.message)}${s.failed.type==='reorder'&&!op?btn('retry','Reintentar',true):''}</p>`;
    return out;
  }
  function controls(s,c,op) {
    if(op)return `<section class="m7-operator"><h3>Atención del contacto activo</h3><p>${esc(statusLabels[s.status])}. Las respuestas humanas se escriben desde el rol Ventas; el cliente no las genera.</p>${btn('take','Tomar conversación',true,!canOperate()||s.status==='humano'||s.status==='cerrado')}${s.purpose==='postventa'?btn('resolve','Proponer cierre de soporte',false,!canOperate()||s.status!=='humano'):''}<details><summary>Controles de demostración</summary>${btn('outside',s.outside?'Simular horario abierto':'Simular fuera de horario',false,!canOperate())}${s.channel==='whatsapp'?btn('expire','Simular vencimiento de 24 h',false,!canOperate()):''}<p>No hay envíos reales ni avisos proactivos por WhatsApp.</p></details></section>`;
    if(s.status==='humano'||s.status==='espera'||s.status==='fuera')return `<p class="m7-muted">Puedes seguir dejando detalles. ${s.status==='humano'?'Una persona del equipo tomó este caso de demostración.':'Esperamos que una persona del equipo tome el caso.'} El seguimiento comercial se realiza por correo.</p>`;
    if(s.purpose==='postventa')return `<div class="m7-options">${option('pedido','Mi pedido')}${option('reponer','Reponer café')}${option('incidencia','Necesito soporte',true)}${option('persona','Pedir ayuda al equipo')}${s.channel==='web'?option('whatsapp','Iniciar postventa en WhatsApp'):''}</div><p class="m7-muted">WhatsApp solo se inicia a petición tuya para postventa. No hay campañas ni avisos proactivos.</p>`;
    const accepted=c.accepted||s.agreement?.status==='confirmada';
    return `<div class="m7-options">${option('propuesta',accepted?'Ver propuesta confirmada':'Entender mi propuesta',true)}${!accepted?option('comparar','Comparar arriendo y compra'):''}${option('correo','Consulta por correo')}</div>${!accepted?'<p class="m7-muted">Elige una opción: comparar no cambia tu selección. La confirmación se hace en el resumen.</p>':'<p class="m7-muted">La propuesta conserva su confirmación. Los ajustes posteriores se consultan por correo.</p>'}`;
  }
  const authors={ia:'Asistente automático · demostración',cliente:'Tú',equipo:'Persona del equipo · demostración',sistema:'Estado del caso'};
  function render(showLast=false) {
    launcher();if(!pane)return;if(!allowed())return close();if(busy||rendering){deferred=true;return;}
    rendering=true;
    const s=load(),c=context(),op=operator();const focus=document.activeElement,focusId=pane.contains(focus)?focus.id:null;
    const compose=pane.querySelector('#m7-message')?.value || '', email=pane.querySelector('#m7-email')?.value, question=pane.querySelector('#m7-email-question')?.value, consent=pane.querySelector('#m7-email-consent')?.checked;
    const selected=focusId==='m7-message'?[focus.selectionStart,focus.selectionEnd]:null;
    const disabled=op && (!canOperate()||s.status!=='humano'||(s.channel==='whatsapp'&&Date.now()-s.waLastClient>=DAY));
    pane.innerHTML=`<div class="m7-backdrop" data-m7="close"></div><section class="m7-panel m7-consultivo" role="dialog" aria-modal="true" aria-labelledby="m7-title" aria-describedby="m7-demo"><header class="m7-head"><div><p class="m7-eyebrow">MARLEY COFFEE EMPRESAS</p><h2 id="m7-title" tabindex="-1">${op?'Atención del equipo':s.purpose==='postventa'?'Te acompañamos después de comprar':'Te ayudamos a decidir'}</h2><p>${esc(statusLabels[s.status])} · ${s.channel==='whatsapp'?'WhatsApp de postventa simulado':'Chat del sitio'}</p></div><button class="m7-close" type="button" data-m7="close" aria-label="Cerrar conversación">×</button></header><p id="m7-demo" class="m7-demo">Demostración · sin envíos reales</p>${c.otherClient?'<section class="m7-card"><h3>Este historial pertenece al contacto del recorrido</h3><p>Selecciona su ficha para continuar; no mezclamos conversaciones de otros clientes.</p></section>':`<details class="m7-context"><summary>El contexto de tu caso</summary><p>${esc(summary(c))}</p><p class="m7-muted">Guardado local de esta demostración. No sincroniza con WhatsApp ni con otros dispositivos.</p></details><div class="m7-thread" role="log" aria-label="Historial de la conversación" aria-live="polite">${s.messages.map(m=>`<article class="m7-msg m7-msg--${esc(m.author)}" data-message-id="${m.id}" tabindex="-1"><p class="m7-author">${esc(m.author==='equipo'&&m.by?m.by+' · persona del equipo (demostración)':authors[m.author])} <time>${esc(new Date(m.at).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}))}</time></p><p>${esc(m.text)}</p></article>`).join('')}</div><div class="m7-tools">${cards(s,c,op)}${controls(s,c,op)}</div><form class="m7-compose"><label for="m7-message">${op?'Respuesta de la persona del equipo':'Escribe tu pregunta'}</label><div><textarea id="m7-message" rows="2" maxlength="900" ${disabled?'disabled':''}>${esc(compose)}</textarea><button type="submit" class="m7-btn m7-btn--primary" ${disabled?'disabled':''}>${op?'Responder':'Enviar'}</button></div>${disabled?'<p class="m7-muted">Toma el caso para responder. En WhatsApp, fuera de 24 horas se espera un nuevo mensaje del cliente.</p>':''}</form>${op?`<details class="m7-audit"><summary>Registro de acciones</summary><ul>${s.audit.map(a=>`<li>${esc(a.text)}</li>`).join('')}</ul></details>`:''}`}</section>`;
    if(email!==undefined&&pane.querySelector('#m7-email'))pane.querySelector('#m7-email').value=email;
    if(question!==undefined&&pane.querySelector('#m7-email-question'))pane.querySelector('#m7-email-question').value=question;
    if(consent!==undefined&&pane.querySelector('#m7-email-consent'))pane.querySelector('#m7-email-consent').checked=consent;
    const thread=pane.querySelector('.m7-thread');if(thread)thread.scrollTop=thread.scrollHeight;
    if(focusId){const el=pane.querySelector('#'+focusId);el?.focus({preventScroll:true});if(selected&&el)el.setSelectionRange(...selected);}
    rendering=false;
    if(showLast){const last=pane.querySelector('.m7-thread article:last-child');last?.scrollIntoView({block:'start',behavior:'auto'});}
  }
  function launcher(){let b=document.getElementById('m7-launcher');if(!allowed()){b?.remove();return;}if(!b){b=document.createElement('button');b.id='m7-launcher';b.type='button';b.className='m7-launcher';b.dataset.m7Open='ayuda';b.setAttribute('aria-haspopup','dialog');document.body.appendChild(b);}b.textContent=operator()?'Atención del contacto':route()==='C09'?'Ayuda y postventa':'Te ayudamos a decidir';b.hidden=Boolean(pane);}
  function panelClick(ev) {
    const target=ev.target?.nodeType===3?ev.target.parentElement:ev.target;const b=target?.closest?.('[data-m7]');if(!b||!pane?.contains(b)||b.disabled)return;
    ev.preventDefault();ev.stopPropagation();const a=b.dataset.m7;if(a==='close')return close();if(context().otherClient)return;
    const op=operator(),team=['take','resolve','outside','expire'];if(team.includes(a)&&!canOperate())return;
    if(op&&!team.includes(a))return;
    if(a==='intent')dispatch({type:'intent',intent:b.dataset.intent,label:b.textContent.trim()});
    else if(a==='mode-select'||a==='rating')dispatch({type:a,value:b.dataset.value});
    else if(a==='email-confirm'){const f=pane.querySelector('#m7-email-form');dispatch({type:a,email:f?.querySelector('[name=email]')?.value,text:f?.querySelector('[name=question]')?.value,consent:Boolean(f?.querySelector('[name=consent]')?.checked)});}
    else dispatch({type:a});
  }
  function open(which='ayuda') {
    if(!allowed())return false;
    load();if(!operator())state=transition(state,{type:'purpose',value:which==='postventa'||route()==='C09'?'postventa':'comercial'},context());
    if(!pane){priorFocus=document.activeElement;pane=document.createElement('div');pane.id='m7-conversacion';pane.className='m7-root';document.body.appendChild(pane);
      // Listener en el contenedor estable: el redibujo de sus hijos no pierde la acción.
      pane.addEventListener('click',panelClick);
      pane.addEventListener('submit',ev=>{ev.preventDefault();ev.stopPropagation();if(context().otherClient || (operator()&&!canOperate()))return;if(ev.target.id==='m7-email-form'){if(!operator())dispatch({type:'email-confirm',email:ev.target.querySelector('[name=email]').value,text:ev.target.querySelector('[name=question]').value,consent:ev.target.querySelector('[name=consent]').checked});return;}if(!ev.target.matches('.m7-compose'))return;const field=ev.target.querySelector('textarea'),text=clean(field?.value);if(!text)return;field.value='';dispatch({type:operator()?'human-send':'send',text});});
      pane.addEventListener('change',ev=>{if(ev.target.matches('[data-m7-qty]')&&!operator())dispatch({type:'quantity',value:ev.target.value});});
      pane.addEventListener('pointerdown',()=>{busy=true;},{passive:true});
      background=[...document.body.children].filter(el=>el!==pane&&!/^(SCRIPT|STYLE|LINK)$/.test(el.tagName)).map(el=>({el,inert:el.inert}));background.forEach(({el})=>el.inert=true);document.body.classList.add('m7-open');
    }
    render(true);if(!['ayuda','postventa'].includes(which)&&!operator())dispatch({type:'intent',intent:which,label:({propuesta:'Quiero entender mi propuesta',comparar:'Quiero comparar arriendo y compra',arriendo:'Quiero comparar arriendo y compra',persona:'Quiero consultar al equipo',whatsapp:'Quiero iniciar postventa en WhatsApp',pedido:'Quiero consultar mi pedido',reponer:'Quiero reponer café',incidencia:'Necesito soporte'})[which]||which});pane?.querySelector('#m7-title')?.focus({preventScroll:true});return true;
  }
  function close(){if(!pane)return;pane.remove();pane=null;busy=false;background.forEach(({el,inert})=>{if(el.isConnected)el.inert=inert;});background=[];document.body.classList.remove('m7-open');launcher();if(priorFocus?.isConnected)priorFocus.focus({preventScroll:true});}
  document.addEventListener('click',ev=>{const t=ev.target?.nodeType===3?ev.target.parentElement:ev.target;const b=t?.closest?.('[data-m7-open]');if(!b)return;ev.preventDefault();open(b.dataset.m7Open||'ayuda');});
  addEventListener('pointerup',()=>{setTimeout(()=>{busy=false;if(deferred){deferred=false;render(true);}},0);},{passive:true});
  addEventListener('pointercancel',()=>{busy=false;if(deferred){deferred=false;render();}},{passive:true});
  document.addEventListener('keydown',ev=>{if(!pane)return;if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();close();return;}if(ev.key!=='Tab')return;const all=[...pane.querySelectorAll('button:not(:disabled),textarea:not(:disabled),input:not(:disabled),summary')].filter(el=>el.getClientRects().length);if(!all.length)return;const first=all[0],last=all.at(-1);if(ev.shiftKey&&(document.activeElement===first||document.activeElement.id==='m7-title')){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}},true);
  addEventListener('hashchange',()=>{if(!allowed())close();else if(pane){if(route()==='C09')load().purpose='postventa';render();}launcher();});
  addEventListener('storage',ev=>{if(M.STATIC||ev.key!==key())return;state=null;stateKey='';render();});
  M.subscribe(()=>{const sig=JSON.stringify(context());if(sig===signature)return;signature=sig;if(pane)render();else launcher();});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',launcher,{once:true});else launcher();
  return {open,close,refresh:render,get:()=>clone(load()),context,transition,fresh,intent,version:VERSION,
    sendClient:text=>!allowed()||operator()?false:dispatch({type:'send',text}),
    confirmProposal:()=>!allowed()||operator()?false:dispatch({type:'proposal-confirm'}),
    selectMode:value=>!allowed()||operator()?false:dispatch({type:'mode-select',value}),
    submitEmail:({email,text,consent}={})=>!allowed()||operator()?false:dispatch({type:'email-confirm',email,text,consent}),
    take:()=>canOperate()&&!context().otherClient?dispatch({type:'take'}):false,
    sendHuman:(text,by)=>{if(!canOperate()||context().otherClient||!clean(text))return false;if(load().status!=='humano')dispatch({type:'take'});return dispatch({type:'human-send',text,by});}};
})();
</script><script>
/* Marley Empresas · R16 · trazabilidad local de conexiones.
   Dibuja exclusivamente el contacto de M4.get(); no agrega prospectos ficticios al puntaje.
   Los conectores externos se presentan como arquitectura propuesta, nunca como envíos ejecutados. */
window.M7Connections = (() => {
  'use strict';
  const M = window.M4, D = window.M4D, R = window.M4R, U = window.M4UI;
  const esc = U.esc;
  const roles = ['ventas', 'marketing', 'jefatura'];
  const ui = { selected: 'origen', open: new Set() };
  roles.forEach((role) => {
    const menu = D.ROLE_MENUS?.[role]?.menu;
    if (menu && !menu.some(([id]) => id === 'R16')) menu.push(['R16', 'Conexiones y actividad', 'chart']);
  });
  D.ROLE_ACCESS = D.ROLE_ACCESS || {}; D.ROLE_ACCESS.R16 = roles.slice();
  const now = () => M.STATIC ? D.REF : Date.now();
  const numeric = (n) => Number.isFinite(Number(n)) ? Number(n) : 0;
  const date = (at) => Number.isFinite(Number(at)) ? new Date(Number(at)).toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'Sin fecha registrada';
  const stageLabel = (stage) => ({ Visitante: 'Visitante', Lead: 'Contacto identificado en el recorrido', MQL: 'Calificado por marketing', SQL: 'Oportunidad aceptada por ventas' })[stage] || stage;
  const readChat = () => { try { return window.M7Chat?.get() || null; } catch (_) { return null; } };
  const chatStatus = (status) => ({ asistente: 'Asistente automático', espera: 'En cola del equipo', fuera: 'Fuera del horario simulado', humano: 'Persona atendiendo', cerrado: 'Caso cerrado' })[status] || 'Sin conversación';
  const agentName = (id) => M.AGENTS?.[id]?.name || id || 'Sistema';
  function model(s = M.get()) {
    const events = (s.events || []).map((e) => ({ key: String(e.key || ''), label: String(e.label || e.key || 'Evento'), points: numeric(e.pts), at: e.at }));
    const score = numeric(M.score(s));
    const sum = events.reduce((n, e) => n + e.points, 0);
    const executive = s.lead?.execId ? Object.values(D.EXECS || {}).find((ex) => ex.id === s.lead.execId) : null;
    const zone = s.answers?.comuna && D.comuna ? D.comuna(s.answers.comuna) : null;
    const zoneName = zone ? D.ZONES?.[zone.zone]?.name || 'Zona por confirmar' : 'Falta la comuna';
    const emails = (s.emails || []).slice().sort((a, b) => numeric(b.at) - numeric(a.at));
    const chat = readChat();
    const sinceWaClient = chat?.waLastClient ? Date.now() - numeric(chat.waLastClient) : Infinity;
    const waWindowOpen = sinceWaClient >= 0 && sinceWaClient < 86400000;
    // Una propuesta aceptada no es historial de compras. Nunca asignar un puntaje financiero de otra cuenta.
    const account = s.lead?.id ? (D.ACCOUNTS || []).find((a) => a.id === s.lead.id && Array.isArray(a.orders) && a.orders.length) : null;
    const financial = account && M.accountStats ? M.accountStats(account).fin : null;
    const feed = [];
    events.forEach((e) => feed.push({ kind: 'Cliente → calificación', actor: 'Cliente y agente de Calificación', at: e.at, text: e.label + ' · ' + (e.points >= 0 ? '+' : '') + e.points + ' puntos' }));
    emails.forEach((e) => feed.push({ kind: 'Correo generado', actor: e.from || 'Sistema Marley', at: e.at, text: e.subject || 'Sin asunto' }));
    (s.agents || []).filter((a) => numeric(a.at) <= now()).forEach((a) => feed.push({ kind: 'Acción de agente simulada', actor: agentName(a.from) + ' → ' + agentName(a.to), at: a.at, text: a.text || '' }));
    (chat?.messages || []).filter((m) => m.author !== 'ia').forEach((m) => feed.push({ kind: 'Conversación y postventa', actor: ({ cliente: 'Cliente', equipo: 'Persona del equipo', sistema: 'Sistema del caso' })[m.author] || 'Sistema', at: m.at, text: m.text }));
    feed.sort((a, b) => numeric(b.at) - numeric(a.at));
    return { s, events, score, sum, executive, zoneName, emails, chat, waWindowOpen, financial, feed: feed.slice(0, 35), stage: M.stage(s), band: M.band ? M.band(score).name : '' };
  }
  const badge = (text, tone = '') => `<span class="m7c-badge ${tone ? 'm7c-badge--' + tone : ''}">${esc(text)}</span>`;
  const details = (id, title, body, cls = '') => `<details class="m7c-details ${cls}" data-m7c-keep="${esc(id)}" ${ui.open.has(id) ? 'open' : ''}><summary>${title}</summary>${body}</details>`;
  const go = (id, label, primary = false) => `<a class="m7c-btn${primary ? ' m7c-btn--primary' : ''}" href="#${id}" data-go="${id}">${esc(label)}</a>`;
  const chatButton = (label = 'Abrir conversación y postventa') => `<button type="button" class="m7c-btn m7c-btn--primary" data-m7c-chat>${esc(label)}</button>`;
  function graph(x) {
    const nodes = [
      ['origen', '1', 'Cliente y sitio', x.s.lead ? x.s.answers?.negocio || 'Contacto en el recorrido' : 'Aún sin contacto', x.s.lead ? 'Origen registrado en esta demostración' : 'Recorre Empresas para comenzar', 'home'],
      ['puntaje', '2', 'Calificación', x.score + ' de 100 puntos', x.events.length + ' eventos registrados · ' + stageLabel(x.stage), 'chart'],
      ['asignacion', '3', 'Equipo de ventas', x.executive ? x.executive.name : 'Asignación pendiente', x.executive ? x.zoneName : 'Se determina con la comuna', 'users'],
      ['canales', '4', 'Conversación y correo', x.emails.length + ' correos generados', x.chat ? chatStatus(x.chat.status) : 'Chat disponible', 'chat'],
      ['operacion', '5', 'Pedido y postventa', x.chat?.ticket ? x.chat.ticket.status : x.chat?.order ? x.chat.order.status : 'Sin pedido de este caso', 'ERP y despacho: conexión por validar', 'truck']
    ];
    return `<section class="m7c-section"><div class="m7c-section-title"><div><p class="m7c-eyebrow">EL MISMO CONTACTO, TODO EL CAMINO</p><h2>Cómo se conectan las acciones</h2></div>${badge('Cada nodo abre su detalle')}</div><ol class="m7c-graph" aria-label="Conexión del recorrido en cinco pasos">${nodes.map(([id, n, label, value, sub, ic]) => `<li><button type="button" class="m7c-node${ui.selected === id ? ' is-selected' : ''}" data-m7c-detail="${id}" aria-controls="m7c-selected-detail" aria-pressed="${ui.selected === id}"><span class="m7c-node-top"><span class="m7c-step">${n}</span>${U.icon(ic, 22)}</span><span class="m7c-node-label">${esc(label)}</span><strong>${esc(value)}</strong><span class="m7c-muted">${esc(sub)}</span><span class="m7c-node-link">Ver detalle →</span></button></li>`).join('')}</ol><p class="m7c-legend"><span class="m7c-dot"></span> Eventos, puntaje, correos e historial: datos locales del recorrido. <span class="m7c-dot m7c-dot--outline"></span> Proveedores y sistemas externos: propuesta de integración, sin conexión activa.</p></section>`;
  }
  function scoreTable(x) {
    return `<div class="m7c-scoreline"><b>${x.score}<small>/100</small></b><div><h3>Puntaje de interacción</h3><p>${esc(x.band)} · ${esc(stageLabel(x.stage))}</p><p class="m7c-muted">Suma de eventos: ${x.sum}. El valor visible se limita a 100. Cada acción se registra una sola vez en el motor del MVP.</p></div></div><div class="m7c-meter" role="meter" aria-label="Puntaje de interacción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.max(0, Math.min(100, x.score))}"><span style="width:${Math.max(0, Math.min(100, x.score))}%"></span></div>${x.events.length ? `<div class="m7c-table-wrap"><table class="m7c-table"><thead><tr><th>Acción registrada</th><th>Puntos</th><th>Cuándo</th></tr></thead><tbody>${x.events.map((e) => `<tr><td>${esc(e.label)}<small>${esc(e.key)}</small></td><td class="m7c-number">${e.points >= 0 ? '+' : ''}${e.points}</td><td>${esc(date(e.at))}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total acumulado</th><td class="m7c-number">${x.sum}</td><td>Visible: ${x.score}/100</td></tr></tfoot></table></div>` : '<p class="m7c-empty">Todavía no hay acciones registradas. Cuando pulses «Ver mi solución», dejes datos o avances en el diagnóstico, aparecerán aquí.</p>'}<p class="m7c-note">Calificado por marketing significa: correo con permiso, negocio HORECA y al menos 40 puntos, según las reglas del MVP. Ventas acepta la oportunidad; el puntaje por sí solo no la cierra.</p><p class="m7c-note"><b>Puntaje financiero:</b> ${x.financial === null ? 'sin base de compras para este contacto. No se calcula con la cotización ni con las compras de otra cuenta.' : esc(x.financial) + '/100, sobre el historial de compras de esta cuenta de demostración.'}</p>${go('R09', 'Ver reglas de puntaje')}`;
  }
  function emailList(x) {

.</li></ol><p>Volver al sitio y regresar al CRM conserva el caso en esta demostración del mismo navegador. En los archivos de wireframes y mockups se muestra el caso de ejemplo correspondiente.</p>${go('C02', 'Continuar como cliente', true)}</section>`);

  // Vista académica opcional. Leer este panel nunca ejecuta pasos del recorrido.
  function mirrorMessages(x) {
    const seen=new Set();
    const sales=(x.s.lead ? x.s.conv?.msgs || [] : []).map(m=>({...m,author:({cliente:'cliente',ejecutiva:'equipo',bot:'ia',sistema:'sistema'})[m.from] || 'sistema',origin:'Conversación de ventas'}));
    const care=(x.chat?.messages || []).map(m=>({...m,origin:'Chat y postventa'}));
    return [...sales,...care].filter(m=>numeric(m.at)<=now()).sort((a,b)=>numeric(a.at)-numeric(b.at)).filter(m=>{
      const key=[m.author,numeric(m.at),m.text].join('|');
      if(seen.has(key))return false;seen.add(key);return true;
    });
  }
  function mirrorStory(x) {
    const events = x.events.filter(e => !e.key.startsWith('__') && numeric(e.at) <= now()).slice().sort((a,b) => numeric(b.at)-numeric(a.at));
    const messages = mirrorMessages(x).filter(m => m.author === 'cliente').reverse();
    const event = events[0], message = messages[0];
    const fromChat = message && (!event || numeric(message.at) > numeric(event.at));
    const action = fromChat ? message.text : event?.label;
    const at = fromChat ? message.at : event?.at;
    let effect = 'Las próximas acciones se reflejarán aquí, sin cambiar de contacto.';
    if (fromChat) effect = 'El mensaje queda en el historial de la conversación. El puntaje conserva las reglas del recorrido.';
    else if (event) effect = `La acción registra ${event.points >= 0 ? '+' : ''}${event.points} puntos. El total visible es ${x.score} de 100.`;
    let next = 'El cliente puede comenzar su diagnóstico; todavía no hay una persona asignada.';
    if (x.chat?.paused) next = 'Postventa atiende la incidencia. Las ofertas y los recordatorios permanecen en pausa.';
    else if (x.s.sql) next = 'Ventas aceptó la oportunidad en esta demostración. El equipo confirma las condiciones y la operación.';
    else if (x.chat?.status === 'humano' || x.s.conv?.status === 'atendida') next = 'Una persona del equipo atiende el caso; el asistente automático deja de responder.';
    else if (x.executive) next = `${x.executive.name} tiene el caso asignado. La asignación no significa que ya esté atendiendo la conversación.`;
    else if (x.s.lead) next = 'El asistente acompaña el recorrido. Falta completar la información necesaria para asignar una persona.';
    return {action:action || 'Aún no hay una acción registrada del cliente.',at,effect,next};
  }

  function handleB2CMenuKeydown(event) {
    const menu = app.querySelector('.b2c-menu-details[open]');

    if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      closeB2CMenu(menu);
      return true;
    }
    if (event.key !== 'Tab') return false;
    const panel = menu.querySelector('.b2c-menu-panel');
    const controls = [...panel.querySelectorAll('a[href],button:not([disabled]),[tabindex="0"]')].filter((el) => !el.hidden && !el.disabled);
    if (!controls.length) return false;
    const first = controls[0], last = controls[controls.length - 1];

      event.preventDefault();
      (event.shiftKey ? last : first).focus({ preventScroll: true });
    }
    return true;
  }
