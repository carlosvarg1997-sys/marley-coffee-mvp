/* ===== Marley Coffee Empresas · v4 ===== */
.m4{--ink:#171717;--ink2:#3a3631;--muted:#675f54;--line:#e7e0d3;--bg:#fff;--cream:#faf7f0;--sand:#f2ece0;--yellow:#f3c900;--yellow-ink:#171717;--green:#376a3c;--green-2:#5c7e38;--green-soft:#e8f0e3;--gold:#9a7614;--danger:#b33a2d;--live:#c2410c;--r:16px;--shadow:0 12px 32px rgba(23,23,23,.07);--font:"Fabriga","Helvetica Neue",Helvetica,Arial,sans-serif;--display:"Festivo","Pressura","Arial Narrow","Helvetica Neue",Arial,sans-serif;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);min-height:100vh}
body[data-artifact=wireframes] .m4{--yellow:#2b2b2b;--yellow-ink:#fff;--green:#4d4d4d;--green-2:#666;--green-soft:#eee;--gold:#555;--cream:#f6f6f6;--sand:#ededed;--live:#333;--line:#d4d4d4}
body[data-artifact=wireframes] .m4 img,body[data-artifact=wireframes] .m4 video,body[data-artifact=wireframes] .m4 svg .m4-node circle{filter:grayscale(1)}
body.m4-body{background:#fff;margin:0}
.m4 *{box-sizing:border-box}
.m4 h1,.m4 h2,.m4 h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.12;margin:0 0 .4em;font-weight:800}
.m4 h1{font-size:clamp(28px,4.2vw,46px)}.m4 h2{font-size:clamp(20px,2.4vw,26px)}.m4 h3{font-size:17px}
.m4 p{margin:0 0 .8em}
.m4 button{font:inherit;cursor:pointer}
.m4 a{color:inherit}
.m4 :focus-visible{outline:3px solid #1f5fbf;outline-offset:2px;border-radius:6px}
.m4-sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.m4-i{flex:none;vertical-align:middle}
.m4-kicker{display:inline-block;font:700 12px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.m4-lead{font-size:17px;color:var(--ink2);max-width:62ch}
.m4-fine{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.m4-center{text-align:center;justify-content:center}
.m4-empty{color:var(--muted);font-size:14px;padding:14px;list-style:none}
.m4-ok{color:var(--green);font-weight:700;display:flex;gap:6px;align-items:center;margin:8px 0}

/* Botones */
.m4-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:2px solid var(--yellow);background:var(--yellow);color:var(--yellow-ink);font-weight:800;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.m4-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(23,23,23,.12)}
.m4-btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.m4-btn--ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.m4-btn--sm{min-height:36px;padding:6px 14px;font-size:14px}
.m4-btn--xl{min-height:54px;padding:14px 26px;font-size:17px}
.m4-btn--block{width:100%}
.m4-link-btn{background:none;border:0;padding:6px 0;font-weight:800;color:var(--ink);display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;text-decoration-color:var(--yellow)}
.m4-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px}
.m4-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sand);color:var(--ink2);white-space:nowrap}
.m4-chip--brand{background:#fff5c2;color:#5c4700}.m4-chip--ok{background:var(--green-soft);color:var(--green)}.m4-chip--dark{background:var(--ink);color:#fff}.m4-chip--warn{background:#fde8e4;color:var(--danger)}.m4-chip--live{background:#ffedd5;color:var(--live)}.m4-chip--light{background:rgba(255,255,255,.9);color:var(--ink)}
body[data-artifact=wireframes] .m4-chip--brand{background:#e5e5e5;color:#222}

/* Barra de evaluación y acceso flotante */
.m4-strip{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:7px 16px;background:#171717;color:#f5f5f5;font-size:13px}
.m4-strip-mode{font-weight:800;letter-spacing:.02em}
.m4-strip-go{display:flex;gap:6px;align-items:center}.m4-strip-go select{max-width:260px;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:8px;padding:4px 6px;font-size:13px}
.m4-strip-btn{background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.m4-strip-btn--hl{background:#f3c900;color:#171717;border-color:#f3c900}
body[data-artifact=wireframes] .m4-strip-btn--hl{background:#fff;border-color:#fff}
.m4-strip-check{display:flex;gap:6px;align-items:center}
.m4-float{position:fixed;right:16px;bottom:16px;z-index:55;display:inline-flex;gap:6px;align-items:center;padding:10px 16px;border-radius:999px;background:#171717;color:#fff!important;font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 10px 24px rgba(0,0,0,.25)}

/* Cliente: encabezado y pie */
.m4-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:#fff}
.m4-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.m4-logo{width:58px;height:auto;display:block}.m4-logo--sm{width:44px}
.m4-wordmark{font:900 16px/1 var(--display);letter-spacing:.12em;border:2px solid #333;padding:6px 8px}
.m4-brand-sub{font:800 13px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--yellow);color:var(--yellow-ink)}
.m4-top-nav{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;justify-content:flex-end}
.m4-top-link{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;text-decoration:none;padding:6px 0}
.m4-top-link--muted{color:var(--muted)}
.m4-top-id{font-size:12px;font-weight:700;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.m4-main{min-height:70vh}
.m4-foot{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;padding:22px clamp(16px,4vw,48px) 80px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:var(--cream)}

/* C02 */
.m4-hero{display:grid;grid-template-columns:1.02fr 1fr;gap:clamp(20px,4vw,56px);align-items:center;padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px);background:linear-gradient(180deg,var(--cream),#fff)}
.m4-hero h1{font-size:clamp(32px,5vw,58px)}
.m4-trust{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px;color:var(--ink2);font-weight:600}
.m4-trust li{display:flex;gap:10px;align-items:center}
.m4-sec{padding:clamp(28px,5vw,64px) clamp(16px,4vw,48px)}
.m4-sec--tight{padding-bottom:12px}
.m4-sec-head{max-width:760px;margin-bottom:22px}.m4-sec-head p{color:var(--muted)}
.m4-cases{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.m4-case{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.m4-case .m4-video,.m4-case-img{border-radius:0;aspect-ratio:16/10;width:100%;object-fit:cover;display:block}
.m4-case-body{padding:14px 16px 16px}.m4-case-body b{font-size:17px}.m4-case-body p{color:var(--ink2);font-size:14px;margin:4px 0 6px}
.m4-how{background:var(--cream)}
.m4-how-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.m4-how-list li{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.m4-how-list span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;margin-bottom:10px}
.m4-how-list b{display:block;font-size:17px;margin-bottom:4px}.m4-how-list p{color:var(--ink2);font-size:14px;margin:0}
.m4-prod-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.m4-prod{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.m4-prod-grid .m4-prod{flex-direction:column;text-align:center;padding:14px 10px}
.m4-prod-img{width:64px;height:64px;object-fit:contain;flex:none;background:#fff}
.m4-prod-grid .m4-prod-img{width:100%;height:120px}
.m4-prod-ph{width:64px;height:64px;flex:none;border-radius:10px;background:var(--sand);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:4px}
.m4-prod b{display:block;font-size:13px;line-height:1.3}.m4-prod small{color:var(--muted);font-size:12px}
.m4-prod-list{display:grid;gap:8px}
.m4-band{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;margin:0 clamp(16px,4vw,48px) 48px;padding:28px clamp(18px,3vw,36px);border-radius:24px;background:var(--ink);color:#fff}
.m4-band p{color:#ddd;margin:0}

/* Video con marca */
.m4-video{position:relative;border-radius:var(--r);overflow:hidden;background:#111;aspect-ratio:16/9;box-shadow:var(--shadow)}
.m4-video video{width:100%;height:100%;object-fit:cover;display:block}
.m4-video--hero{aspect-ratio:4/3}
.m4-plate{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.m4-plate-logo{width:46px}
.m4-video-tag{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;background:rgba(23,23,23,.72);color:#fff;border-radius:999px;padding:3px 10px}
.m4-video-wf-badge{position:absolute;left:10px;top:10px;display:inline-flex;gap:6px;align-items:center;background:#fff;color:#171717;border:2px dashed #555;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800}
.m4-ph{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#eee,#eee 10px,#e2e2e2 10px,#e2e2e2 20px);color:#444;font-weight:700;font-size:13px;text-align:center;padding:10px;min-height:120px}

/* Formularios y diagnóstico */
.m4-narrow{max-width:620px;margin:0 auto;padding:28px 16px 40px}.m4-narrow--wide{max-width:760px}
.m4-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,26px);box-shadow:var(--shadow)}
.m4-steps-bar{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 18px;flex-wrap:wrap}
.m4-steps-bar li{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:var(--cream);border:1px solid var(--line)}
.m4-steps-bar li span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12px}
.m4-steps-bar li.now{color:var(--ink);background:#fff7cc;border-color:var(--yellow)}.m4-steps-bar li.now span{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.m4-steps-bar li.done span{background:var(--green);border-color:var(--green);color:#fff}
.m4-field{display:grid;gap:6px;margin-bottom:14px;font-weight:700;font-size:14px}
.m4-field input,.m4-field select,.m4-inline-field select{font:inherit;font-weight:400;min-height:48px;border:1.5px solid #cfc6b6;border-radius:12px;padding:10px 14px;background:#fff;width:100%}
.m4-field--lg select{min-height:56px;font-size:17px}
.m4-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:4px 0 12px}.m4-check input{width:20px;height:20px;margin-top:1px;accent-color:var(--green)}
.m4-form-msg{color:var(--danger);font-weight:700;min-height:1em;font-size:14px}
.m4-diag{max-width:1080px;margin:0 auto;padding:28px 16px 40px}
.m4-diag-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.m4-q-top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:6px}.m4-q-top .m4-kicker{margin:0}
.m4-progress{flex:1;max-width:220px;height:8px;border-radius:99px;background:var(--sand);overflow:hidden}.m4-progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.m4-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.m4-opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:700;transition:border-color .15s,background .15s}
.m4-opt:hover{border-color:#bfb4a0}
.m4-opt[aria-pressed=true]{border-color:var(--green);background:var(--green-soft)}
.m4-opt-dot{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid #bfb4a0;flex:none;font-size:13px;color:#fff}
.m4-opt[aria-pressed=true] .m4-opt-dot{background:var(--green);border-color:var(--green)}
.m4-opts--multi .m4-opt-dot{border-radius:6px}
.m4-summary h2{font-size:18px}
.m4-summary ul,.m4-kv{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.m4-summary li,.m4-kv li{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.m4-summary li span,.m4-kv li span{color:var(--muted)}.m4-summary li b,.m4-kv li b{text-align:right}
.m4-exec-preview,.m4-exec-card,.m4-exec-mini{display:flex;gap:12px;align-items:center}
.m4-exec-preview{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin-top:4px}
.m4-exec-preview small,.m4-exec-card small,.m4-exec-mini small{display:block;color:var(--muted);font-size:13px}
.m4-exec-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--cream);margin:6px 0 16px}
.m4-status{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--green);margin-top:2px}
.m4-status i{width:9px;height:9px;border-radius:50%;background:#2e9e4f}.m4-status i.busy{background:#d99a00}

/* Avatares */
.m4-av{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:var(--sand);color:var(--ink);font-weight:800;font-size:13px}
.m4-av--exec{background:var(--ink);color:var(--yellow)}
.m4-av--bot{background:var(--green-2);color:#fff}
.m4-av--lg{width:52px;height:52px;font-size:17px}.m4-av--xl{width:64px;height:64px;font-size:21px}

/* C05 canales */
.m4-chs{display:grid;gap:10px}
.m4-ch{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;position:relative}
.m4-ch:hover{border-color:#bfb4a0}
.m4-ch.is-on{border-color:var(--ink);box-shadow:0 0 0 3px #fff3b0}
.m4-ch-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--cream);flex:none}
.m4-ch.is-on .m4-ch-ic{background:var(--yellow);color:var(--yellow-ink)}
.m4-ch-txt b{display:block;font-size:16px}.m4-ch-txt small{color:var(--ink2);font-size:14px}
.m4-ch-badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--green-soft);color:var(--green);padding:3px 8px;border-radius:999px;white-space:nowrap}
.m4-ch-extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding:14px;background:var(--cream);border-radius:14px}

/* C06 portal */
.m4-portal,.m4-account{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
.m4-portal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.m4-portal-head h1{font-size:clamp(24px,3.4vw,36px);margin:0}
.m4-portal-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.m4-portal-main{display:grid;gap:12px}.m4-portal-side{display:grid;gap:16px}
.m4-status-card{position:relative;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;overflow:hidden}
.m4-status-card small{display:block;color:var(--ink2)}.m4-status-card .m4-btn{margin-left:auto}
.m4-status-card.wait{background:#fffbea;border-color:#f1dd85}.m4-status-card.ok{background:var(--green-soft);border-color:#c8dbbf}.m4-status-card.call{background:#fff3e6;border-color:#f3c79a}
.m4-pulse{position:absolute;right:16px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#2e9e4f;animation:m4p 1.4s infinite}
@keyframes m4p{0%{box-shadow:0 0 0 0 rgba(46,158,79,.5)}100%{box-shadow:0 0 0 14px rgba(46,158,79,0)}}
.m4-prop-banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--ink);color:#fff}.m4-prop-banner small{display:block;color:#ddd}.m4-prop-banner .m4-btn{margin-left:auto}
.m4-seg-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.m4-segs{display:inline-flex;gap:4px;padding:4px;background:var(--sand);border-radius:999px;flex-wrap:wrap}
.m4-seg{display:inline-flex;gap:6px;align-items:center;border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink2)}
.m4-seg-row .m4-seg{background:#fff;border:1px solid var(--line)}
.m4-seg.is-on{background:var(--ink);color:#fff}
.m4-chat{padding:0;display:flex;flex-direction:column;overflow:hidden}
.m4-chat-head{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}.m4-chat-head span{margin-left:auto;color:var(--muted);font-size:12px}
.m4-chat-log{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:420px;min-height:220px;overflow-y:auto;background:var(--cream)}
.m4-msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.m4-msg.is-mine{align-self:flex-end;flex-direction:row-reverse}
.m4-bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.m4-msg.is-mine .m4-bubble{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:16px 16px 4px 16px}
.m4-msg--bot .m4-bubble{background:#f2f7ee;border-color:#d5e3cc}
.m4-msg--ejecutiva:not(.is-mine) .m4-bubble{border-left:3px solid var(--yellow)}
.m4-bubble p{margin:2px 0 4px;white-space:pre-wrap}
.m4-who{display:block;font-size:11px;font-weight:800;color:var(--muted)}.m4-msg.is-mine .m4-who{color:#cfcfcf}
.m4-bubble time{display:block;font-size:11px;color:var(--muted);text-align:right}.m4-msg.is-mine time{color:#bdbdbd}
.m4-sim{font-style:normal;background:#fff3c4;color:#5c4700;border-radius:6px;padding:0 5px;margin-left:4px}
.m4-sys{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px;text-align:center}
.m4-typing{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.m4-typing span{width:6px;height:6px;border-radius:50%;background:#9b9286;animation:m4t 1s infinite}.m4-typing span:nth-child(2){animation-delay:.15s}.m4-typing span:nth-child(3){animation-delay:.3s;margin-right:4px}
@keyframes m4t{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.m4-quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 0}
.m4-quick-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.m4-composer{display:flex;gap:8px;align-items:flex-end;padding:12px 16px 16px}
.m4-composer textarea{flex:1;font:inherit;resize:none;min-height:46px;max-height:140px;border:1.5px solid #cfc6b6;border-radius:14px;padding:11px 14px}
.m4-send{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:0;background:var(--yellow);color:var(--yellow-ink);flex:none}
.m4-eval-hint{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin:0}
.m4-eval-hint a{font-weight:800}
.m4-wait h2{font-size:19px}.m4-wait .m4-video{margin:8px 0 6px}
.m4-details summary{font-weight:800;cursor:pointer}.m4-details ul{margin-top:10px}

/* C07 */
.m4-prop{max-width:1060px;margin:0 auto;padding:24px 16px 40px}
.m4-plans{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.m4-plan{display:grid;gap:12px;text-align:left;padding:20px;border:2px solid var(--line);border-radius:20px;background:#fff;align-content:start}
.m4-plan.is-on{border-color:var(--ink);box-shadow:0 0 0 4px #fff3b0}
.m4-plan-top{display:flex;justify-content:space-between;align-items:center}.m4-plan-top b{font:800 22px/1 var(--display)}
.m4-inc{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:14px}.m4-inc li{display:flex;gap:6px;align-items:flex-start}.m4-inc .m4-i{color:var(--green)}
.m4-done .m4-i{color:var(--green)}

/* C08 experiencia */
.m4-exp{position:relative;height:calc(var(--n) * 90vh)}
.m4-exp-sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:#111}
.m4-exp-stage,.m4-exp-scene{position:absolute;inset:0}
.m4-exp-scene{transition:opacity .2s linear;will-change:transform,opacity}
.m4-exp-scene .m4-video,.m4-exp-scene .m4-fill{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover}
.m4-exp-caps{position:absolute;left:clamp(16px,4vw,48px);bottom:clamp(60px,10vh,110px);max-width:460px;z-index:20}
.m4-exp-cap{display:none;background:rgba(255,255,255,.95);border-radius:20px;padding:20px 22px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.m4-exp-cap.is-on{display:block;animation:m4in .35s ease}
@keyframes m4in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.m4-exp-cap ul{margin:0;padding-left:18px;font-size:14px}
.m4-exp-dots{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:20}
.m4-exp-dots button{width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0}
.m4-exp-dots button[aria-current=true]{background:var(--yellow);border-color:var(--yellow)}
.m4-exp-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.2);z-index:20}.m4-exp-bar i{display:block;height:100%;background:var(--yellow)}
.m4-exp-static{display:grid;gap:22px}
.m4-exp-row{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.m4-exp-row .m4-exp-cap{display:block;box-shadow:none;border:1px solid var(--line)}
.m4-exp-media .m4-video,.m4-exp-media .m4-fill{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);display:block}
.m4-ref{background:var(--cream)}

/* C09 */
.m4-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.m4-kpis--6{grid-template-columns:repeat(6,1fr)}.m4-kpis--client{grid-template-columns:repeat(3,1fr)}
.m4-kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;align-content:start}
.m4-kpi span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.m4-kpi b{font:800 clamp(20px,2.2vw,26px)/1.15 var(--display)}
.m4-kpi small{font-size:12px;color:var(--muted)}
.m4-ref-card{background:var(--ink);color:#fff;border-color:var(--ink)}.m4-ref-card p{color:#ddd}
.m4-code{display:inline-block;font:800 18px/1 monospace;letter-spacing:.1em;background:var(--yellow);color:var(--yellow-ink);padding:8px 12px;border-radius:10px}
.m4-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.m4-table{width:100%;border-collapse:collapse;font-size:14px}
.m4-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.m4-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.m4-table td small{display:block;color:var(--muted);font-size:12px}
.m4-table .num{text-align:right;white-space:nowrap}
.m4-table--click tbody tr{cursor:pointer}.m4-table--click tbody tr:hover{background:var(--cream)}
.m4-td-score{display:flex;gap:8px;align-items:center;min-width:120px}

/* Barras */
.m4-bar{display:inline-block;flex:1;min-width:60px;height:8px;border-radius:99px;background:var(--sand);overflow:hidden;vertical-align:middle}
.m4-bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.m4-bar.fin i{background:var(--gold)}
body[data-artifact=wireframes] .m4-bar i{background:#555}

/* CRM */
.m4-crm{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 40px);background:#f6f4ef}
.m4-side{position:sticky;top:40px;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px;padding:18px 14px;background:#fff;border-right:1px solid var(--line)}
.m4-side-brand{display:flex;gap:10px;align-items:center;text-decoration:none;font:800 13px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;padding:0 6px 10px;border-bottom:1px solid var(--line)}
.m4-side-nav{display:grid;gap:4px}
.m4-nav{position:relative;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;font-weight:700;text-decoration:none;color:var(--ink2)}
.m4-nav:hover{background:var(--cream)}
.m4-nav.is-on{background:var(--ink);color:#fff}
.m4-badge{margin-left:auto;font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;display:inline-grid;place-items:center;border-radius:99px;background:var(--live);color:#fff;padding:0 6px}
.m4-side-user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--cream);font-size:13px}.m4-side-user small{display:block;color:var(--muted)}
.m4-crm-body{min-width:0;display:flex;flex-direction:column}
.m4-crm-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:18px clamp(16px,2.5vw,32px) 10px}
.m4-crm-title h1{font-size:clamp(24px,2.8vw,32px);margin:0}.m4-crm-title p{margin:2px 0 0;color:var(--muted);font-size:14px}
.m4-crm-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.m4-bell{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line)}.m4-bell .m4-badge{position:absolute;top:-4px;right:-6px}
.m4-crm-main{padding:8px clamp(16px,2.5vw,32px) 24px;display:grid;gap:16px;align-content:start}
.m4-crm-foot{padding:0 clamp(16px,2.5vw,32px) 80px;color:var(--muted);font-size:12px}
.m4-crm .m4-card{box-shadow:none}
.m4-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.m4-card-head h2{font-size:19px;margin:0}
.m4-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.m4-grid-2--wide{grid-template-columns:1.1fr 1fr}
.m4-hint{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#fffbea;border:1px solid #f1dd85;font-size:14px}.m4-hint a{font-weight:800}.m4-hint .m4-btn{margin-left:auto}
.m4-rows{list-style:none;margin:0;padding:0;display:grid}
.m4-row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.m4-row.is-live{background:#fff8ef;border-radius:12px;padding:10px}
.m4-row-main{flex:1;min-width:150px}.m4-row-main small{display:block;color:var(--muted);font-size:13px}
.m4-row-ch{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink2);font-weight:700}
.m4-row-score{font:800 20px/1 var(--display)}.m4-row-score small{font-size:11px;color:var(--muted);margin-left:2px}
.m4-feed{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.m4-ag{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--cream)}
.m4-ag.is-typing{opacity:.8}
.m4-ag p{margin:0;font-size:14px}.m4-ag-line{font-size:13px!important;color:var(--muted)}.m4-ag-line b{color:var(--ink)}.m4-ag-line time{margin-left:6px}
.m4-ag-from{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:10px;background:var(--c);color:#fff;font-weight:800;font-size:11px;letter-spacing:.04em}
body[data-artifact=wireframes] .m4-ag-from{background:#555}
.m4-ag-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px!important}.m4-ag-actions span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.m4-hbars{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.m4-hbars li{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 40px;gap:10px;align-items:center;font-size:14px}.m4-hbars b{text-align:right}
.m4-hbars--parts li{grid-template-columns:minmax(150px,1.4fr) 2fr 36px}
.m4-toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.m4-inline-field{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}.m4-inline-field select{min-height:40px;width:auto}

/* Bandeja */
.m4-inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:14px;align-items:start}
.m4-inbox-list{display:grid;gap:6px;align-content:start}
.m4-segs--wrap{margin-bottom:6px}
.m4-conv{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--line);background:#fff;position:relative}
.m4-conv.is-on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.m4-conv-txt{display:grid;gap:2px;min-width:0}.m4-conv-txt b{font-size:14px}.m4-conv-txt small{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m4-conv-meta{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.m4-dot{position:absolute;right:10px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--live)}
.m4-inbox-thread{padding:0;display:flex;flex-direction:column;overflow:hidden}
.m4-thread-head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.m4-thread-head small{display:block;color:var(--muted);font-size:13px}
.m4-thread-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.m4-inbox-thread .m4-chat-log{max-height:52vh;min-height:300px}
.m4-callcard{display:flex;gap:10px;align-items:center;margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:#fff3e6;border:1px solid #f3c79a;font-size:14px}.m4-callcard small{display:block;color:var(--ink2)}
.m4-callcard.hecha{background:var(--green-soft);border-color:#c8dbbf}
.m4-ctx{display:grid;gap:12px}
.m4-ctx-head{display:flex;gap:12px;align-items:center}.m4-ctx-head small{display:block;color:var(--muted)}
.m4-ctx-chips{display:flex;flex-wrap:wrap;gap:6px}
.m4-score-row{display:grid;gap:6px}.m4-score-row div{display:flex;align-items:baseline;gap:8px}.m4-score-row span{font-size:12px;color:var(--muted);font-weight:700}.m4-score-row b{font:800 26px/1 var(--display)}.m4-score-row small{color:var(--muted)}
.m4-score-row .m4-bar{width:100%}

/* Ficha */
.m4-ficha-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.m4-ficha-head p{margin:6px 0 0;color:var(--ink2)}
.m4-buys{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.m4-buys li{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:center}
.m4-buys .m4-prod{border:0;padding:0}
.m4-share{display:flex;gap:8px;align-items:center}
.m4-nba{display:flex;gap:8px;align-items:flex-start;font-weight:700;background:#fffbea;border-radius:12px;padding:12px;margin:0 0 8px}
.m4-events{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.m4-events li{display:grid;grid-template-columns:1fr auto 50px;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:4px}.m4-events b{color:var(--green)}.m4-events time{color:var(--muted);font-size:12px;text-align:right}
.m4-checks{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:8px}
.m4-checks li{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--muted)}.m4-checks li.ok{color:var(--green)}
.m4-checks li i{width:16px;height:16px;border-radius:50%;border:2px solid #c9c0b0}

/* Panel */
.m4-segs-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.m4-segcard{display:grid;gap:4px}.m4-segcard>b{font:800 34px/1 var(--display)}.m4-segcard>small{color:var(--muted);margin-bottom:6px}
.m4-cols{display:flex;gap:12px;align-items:flex-end;height:220px;padding-top:10px}
.m4-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px}
.m4-col i{display:block;width:100%;max-width:56px;background:var(--gold);border-radius:8px 8px 0 0}
.m4-col b{font-size:12px}.m4-col span{color:var(--muted);text-transform:capitalize}
.m4-funnel{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.m4-funnel li{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.m4-funnel i{display:block;height:26px;border-radius:8px;background:var(--green)}.m4-funnel b{text-align:right}

/* Mapa */
.m4-map-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.m4-map{width:100%;height:auto;display:block}
.m4-tile{cursor:pointer}
.m4-tile rect{fill:#f3efe6;stroke:#fff;stroke-width:2;transition:fill .2s}
.m4-tile.lvl1 rect{fill:#e9e2c8}.m4-tile.lvl2 rect{fill:#d8c784}.m4-tile.lvl3 rect{fill:#8fa96f}.m4-tile.lvl4 rect{fill:#376a3c}
.m4-tile.is-on rect{stroke:#171717;stroke-width:4}
.m4-tile:hover rect,.m4-tile:focus rect{stroke:#171717;stroke-width:3;outline:none}
.m4-tile .t-name{font:700 12px var(--font);fill:#171717}.m4-tile .t-val{font:800 22px var(--display);fill:#171717}.m4-tile .t-n{font:700 11px var(--font);fill:#3a3631}.m4-tile .t-tier{font:800 12px var(--font);fill:#9a7614}
.m4-tile.lvl4 text{fill:#fff}.m4-tile.lvl4 .t-tier{fill:#f3c900}
body[data-artifact=wireframes] .m4-tile.lvl1 rect{fill:#ececec}body[data-artifact=wireframes] .m4-tile.lvl2 rect{fill:#cfcfcf}body[data-artifact=wireframes] .m4-tile.lvl3 rect{fill:#9a9a9a}body[data-artifact=wireframes] .m4-tile.lvl4 rect{fill:#555}
.m4-legend{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}.m4-legend i{width:18px;height:12px;border-radius:3px;display:inline-block}
.m4-legend .lvl1{background:#e9e2c8}.m4-legend .lvl2{background:#d8c784}.m4-legend .lvl3{background:#8fa96f}.m4-legend .lvl4{background:#376a3c}
.m4-regions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.m4-region{display:grid;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px}.m4-region span{color:var(--muted)}.m4-region.is-on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.m4-map-side h3{font-size:15px;margin:14px 0 6px}
.m4-mini-list{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.m4-mini-list li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:var(--cream);font-size:14px;cursor:pointer}.m4-mini-list li.m4-empty{cursor:default;background:none}

/* Red de agentes */
.m4-net{width:100%;height:auto;display:block}
.m4-net line{stroke:#d9d1c2;stroke-width:2}
.m4-net line.hot{stroke:var(--yellow);stroke-width:4;stroke-dasharray:8 6;animation:m4dash 1s linear infinite}
@keyframes m4dash{to{stroke-dashoffset:-28}}
.m4-node circle{fill:var(--c);stroke:#fff;stroke-width:4}
.m4-node.core circle{stroke:var(--yellow);stroke-width:5}
.m4-node .n1{font:800 14px var(--font);fill:#fff;dominant-baseline:middle}.m4-node .n2{font:700 12px var(--font);fill:#171717}
.m4-agent-legend{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m4-agent-legend li{display:grid;grid-template-columns:38px 1fr;gap:2px 10px;align-items:center;font-size:13px}.m4-agent-legend .m4-ag-from{grid-row:span 2}.m4-agent-legend small{color:var(--muted)}
.m4-approvals{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:8px}
.m4-approvals li{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}.m4-approvals li div{flex:1;min-width:180px}.m4-approvals small{display:block;color:var(--muted)}
.m4-plan-crm h3{font-size:18px}

/* Avisos y correo */
#m4-toasts{position:fixed;right:16px;top:56px;z-index:80;display:grid;gap:10px;width:min(360px,calc(100vw - 32px))}
.m4-toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#171717;color:#fff;box-shadow:0 16px 36px rgba(0,0,0,.28);font:14px/1.4 "Helvetica Neue",Arial,sans-serif;animation:m4in .3s ease;transition:opacity .4s}
.m4-toast.out{opacity:0}.m4-toast small{display:block;color:#cfcfcf}.m4-toast button{margin-left:auto;background:#f3c900;color:#171717;border:0;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer}
.m4-toast-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#333;flex:none}
#m4-mail{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
#m4-mail[hidden]{display:none}
.m4-mailbox{width:min(860px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;font:15px/1.5 "Helvetica Neue",Arial,sans-serif;color:#171717}
.m4-mail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.m4-mail-head h2{margin:0;font-size:20px}
.m4-mail-grid{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-top:12px}
.m4-mail-list{display:grid;gap:6px;align-content:start}.m4-mail-list button{text-align:left;border:1px solid #e7e0d3;background:#fff;border-radius:12px;padding:10px;cursor:pointer}.m4-mail-list button.is-on{border-color:#171717}.m4-mail-list small{display:block;color:#675f54}
.m4-mail-body{border:1px solid #e7e0d3;border-radius:14px;padding:16px}.m4-mail-body .m4-logo{width:52px}
.m4-mailbox .m4-btn{display:inline-flex;align-items:center;border-radius:999px;border:2px solid #171717;background:transparent;padding:6px 14px;font-weight:800;cursor:pointer}

/* Barra de pestañas móvil del CRM */
.m4-tabbar{display:none}

/* ===== Responsivo ===== */
@media (max-width:1100px){
  .m4-cases{grid-template-columns:repeat(2,1fr)}.m4-prod-grid{grid-template-columns:repeat(3,1fr)}
  .m4-inbox{grid-template-columns:260px minmax(0,1fr)}.m4-inbox-side{grid-column:1/-1}
  .m4-kpis--6{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .m4-hero,.m4-diag-grid,.m4-portal-grid,.m4-grid-2,.m4-grid-2--wide,.m4-map-grid,.m4-exp-row,.m4-plans{grid-template-columns:1fr}
  .m4-how-list{grid-template-columns:1fr}.m4-segs-cards{grid-template-columns:1fr}
  .m4-kpis{grid-template-columns:repeat(2,1fr)}.m4-kpis--6{grid-template-columns:repeat(2,1fr)}.m4-kpis--client{grid-template-columns:1fr}
  .m4-crm{grid-template-columns:1fr}
  .m4-side{display:none}
  .m4-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:58;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .m4-tabbar .m4-nav{flex-direction:column;gap:2px;padding:6px 4px;font-size:10.5px;flex:1;align-items:center;border-radius:10px}
  .m4-tabbar .m4-badge{position:absolute;top:0;right:12%;margin:0}
  .m4-body--crm .m4-float{bottom:78px}
  .m4-inbox{grid-template-columns:1fr}
  .m4-inbox-list{grid-auto-flow:column;grid-auto-columns:minmax(240px,82%);overflow-x:auto;padding-bottom:4px}
  .m4-inbox-list .m4-segs--wrap{display:none}
  .m4-exp-caps{right:16px;bottom:24px}
  .m4-mail-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .m4-top{flex-wrap:wrap}.m4-top-nav{gap:4px 12px}.m4-top-link span{display:none}.m4-top-link:nth-last-child(2) span{display:inline}
  .m4-logo{width:48px}
  .m4-opts{grid-template-columns:1fr}
  .m4-ch-extra{grid-template-columns:1fr}
  .m4-prod-grid{grid-template-columns:repeat(2,1fr)}.m4-cases{grid-template-columns:1fr}
  .m4-strip{font-size:12px;padding:6px 12px}.m4-strip-go select{max-width:170px}
  .m4-strip-mode{width:100%}
  .m4-crm-top{padding-top:12px}.m4-crm-tools{width:100%;justify-content:space-between}
  .m4-hbars li,.m4-hbars--parts li{grid-template-columns:1fr 1fr 32px}
  .m4-funnel li{grid-template-columns:110px 1fr 32px}
  .m4-buys li{grid-template-columns:1fr}
  .m4-msg{max-width:96%}
  .m4-chat-log{max-height:60vh}
  .m4-float{right:12px;bottom:12px;padding:9px 13px;font-size:13px}
  .m4-band{margin:0 16px 40px}
  .m4-agent-legend{grid-template-columns:1fr}
  .m4-ficha-head .m4-thread-actions{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.m4 *{animation:none!important;transition:none!important}}

/* Ajustes tras la primera revisión visual */
.m4 h1[tabindex="-1"]:focus{outline:none}
.m4-strip,.m4-float{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.m4-crm-main>*,.m4-grid-2>*,.m4-portal-grid>*,.m4-inbox>*,.m4-map-grid>*,.m4-diag-grid>*{min-width:0}
.m4-card{min-width:0}
.m4-events li{grid-template-columns:1fr auto 74px}.m4-events time{white-space:nowrap}
.m4-tile .t-name{font-size:11.5px}
.m4-inbox-list .m4-seg{padding:6px 11px;font-size:13px}
/* Wireframes: legibilidad del logotipo de texto, avatares y leyenda en gris */
.m4-wordmark{white-space:nowrap}
.m4-side-brand .m4-wordmark,.m4-mail-body .m4-wordmark{font-size:11px;padding:5px 6px;letter-spacing:.08em}
.m4-plate .m4-wordmark{font-size:11px;padding:4px 5px}
body[data-artifact=wireframes] .m4-av--exec{color:#fff}
body[data-artifact=wireframes] .m4-legend .lvl1{background:#ececec}body[data-artifact=wireframes] .m4-legend .lvl2{background:#cfcfcf}body[data-artifact=wireframes] .m4-legend .lvl3{background:#9a9a9a}body[data-artifact=wireframes] .m4-legend .lvl4{background:#555}
body[data-artifact=wireframes] .m4-tile rect{fill:#f4f4f4}
body[data-artifact=wireframes] .m4-tile .t-tier,body[data-artifact=wireframes] .m4-tile.lvl4 .t-tier{fill:#111}
body[data-artifact=wireframes] .m4-tile.lvl4 .t-tier{fill:#fff}

/* Anotaciones UX por pantalla */
#m4-notes{position:fixed;right:0;top:40px;bottom:0;width:330px;z-index:58;background:#fffdf6;border-left:3px solid #f3c900;box-shadow:-10px 0 30px rgba(0,0,0,.12);padding:14px 16px 20px;overflow:auto;font:14px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#171717}
#m4-notes[hidden]{display:none}

.m4-notes-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7a5a00}
.m4-notes-head button{border:0;background:#f2ece0;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer}
.m4-note-row{border-top:1px dashed #e0d6bf;padding:8px 0}.m4-note-row b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#5f5a52}.m4-note-row p{margin:2px 0 0}
.m4-notes-foot{font-size:11.5px;color:#666;margin-top:10px}
body[data-artifact=wireframes] #m4-notes{background:#fafafa;border-left-color:#555}
body[data-artifact=wireframes] .m4-notes-head{color:#333}
.m4-strip-btn[aria-pressed=true]{background:#fff;color:#171717;border-color:#fff}
@media (min-width:1100px){body.m4-notes-open .m4{margin-right:330px}body.m4-notes-open .m4-float{right:346px}}
@media (max-width:1099px){#m4-notes{top:auto;height:62vh;width:auto;left:0;border-left:0;border-top:3px solid #f3c900;border-radius:16px 16px 0 0}}
/* ===== Lead magnets LM1–LM7 (visibles antes de cada esfuerzo) ===== */
.m4-lm{position:relative;display:grid;gap:4px;margin:16px 0;padding:14px 16px;border-radius:16px;background:var(--cream);border:1px solid #efe2b8;border-left:5px solid var(--yellow)}
.m4-lm-tag{display:inline-flex;gap:6px;align-items:center;font:800 12px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.m4-lm-title{font-size:17px;line-height:1.3}
.m4-lm p{margin:0;color:var(--ink2)}
.m4-lm ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:4px;font-size:14px;color:var(--ink2)}.m4-lm li{display:flex;gap:6px;align-items:flex-start}.m4-lm li .m4-i{color:var(--green);flex:none;margin-top:2px}
.m4-lm--line{display:flex;gap:8px;align-items:flex-start;margin:10px 0 14px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--ink2)}.m4-lm--line>.m4-i{color:var(--gold);flex:none;margin-top:2px}
.m4-lm-card{border-left:5px solid var(--yellow)}
.m4-lm-card h2{font-size:19px;margin:0 0 4px}
.m4-lm-card--row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:18px 0}.m4-lm-card--row>div:first-child{flex:1 1 320px;min-width:0}.m4-lm-card--row .m4-actions{margin:0}
.m4-account>.m4-lm-card{margin-top:18px}
.m4-svc-list{display:grid;gap:8px;margin-top:10px}
.m4-svc-list--grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.m4-svc{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.m4-svc:hover{border-color:var(--ink)}.m4-svc>.m4-i{flex:none;margin-top:2px;color:var(--gold)}
.m4-svc b{display:block;font-size:15px;line-height:1.3}.m4-svc small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.m4-svc.is-on{border-color:var(--green);background:var(--green-soft)}.m4-svc.is-on>.m4-i{color:var(--green)}
.m4-svc:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.m4-ref-card .m4-actions{margin-top:12px}
.m4-exec-mini .m4-link-btn{margin-top:2px;font-size:13px}
/* CRM */
.m4-lm-ctx{display:grid;gap:6px;margin:10px 0 12px}.m4-lm-ctx>span{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.m4-lm-ctx small{display:flex;gap:6px;align-items:flex-start;color:var(--ink2);font-size:13px}
.m4-lm-chips{display:flex;flex-wrap:wrap;gap:6px}
.m4-lmchip{display:inline-flex;gap:4px;align-items:center;padding:3px 9px;border-radius:999px;border:1px dashed #cfc6b6;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.m4-lmchip.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--green)}
.m4-lmlist{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:10px}
.m4-lmlist li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.m4-lmlist-ic{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid #c9c0b0;margin-top:1px}
.m4-lmlist li.ok{color:var(--ink)}.m4-lmlist li.ok .m4-lmlist-ic{border-color:var(--green);background:var(--green);color:#fff}
.m4-lmlist b{display:block;font-size:14px}.m4-lmlist small{display:block;font-size:13px;line-height:1.4;color:var(--muted)}

/* ===== Marley Coffee Empresas · v5 · sistema visual =====
   Marca (ley): Festivo para titulares (solo mayúsculas, peso 500) y GT Pressura para texto, desde el servidor oficial de Marley Coffee.
   Paleta oficial: negro dominante, blanco, amarillo #F7BE00, verde #5E7E29, rojo #DB0032 y grises #3F3F40 / #222.
   Movimiento: transform y opacity, curvas de salida, respeta prefers-reduced-motion. */
@font-face{font-family:"MC Festivo";src:url(https://coffeemarleycl.vtexassets.com/assets/vtex/assets-builder/coffeemarleycl.a21/2.0.3/Festivo/Festivo___482a8574c9946a734d1fb5e58c3b78d7.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Festivo";src:url(https://coffeemarleycl.vtexassets.com/assets/vtex/assets-builder/coffeemarleycl.a21/2.0.3/Festivo/Festivo___482a8574c9946a734d1fb5e58c3b78d7.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"Pressura";src:url(https://coffeemarleycl.vtexassets.com/assets/vtex/assets-builder/coffeemarleycl.a21/2.0.3/Pressura/GT-Pressura___226f58ab113a6d821def90a7d6dc2427.ttf) format("truetype");font-weight:500;font-display:swap}
@font-face{font-family:"MC Pressura";src:url(https://coffeemarleycl.vtexassets.com/assets/vtex/assets-builder/coffeemarleycl.a21/2.0.3/Pressura/GT-Pressura___226f58ab113a6d821def90a7d6dc2427.ttf) format("truetype");font-weight:500;font-display:swap}
.m4{--k:#0d0d0d;--k2:#171717;--k3:#222;--g7:#3f3f40;--g5:#6b6b6c;--g4:#8c8c8d;--g3:#c9c9c9;--g2:#e4e4e4;--g1:#efefef;--g0:#f6f6f6;--w:#fff;--y:#f7be00;--y-soft:#fff4cc;--gr:#5e7e29;--gr-soft:#eaf0e1;--rd:#db0032;--rd-soft:#fde6ec;
  --yellow:var(--y);--yellow-ink:var(--k);--ink:var(--k2);--ink2:#2e2e2f;--muted:#5d5d5e;--line:var(--g2);--cream:var(--g0);--sand:var(--g1);--green:var(--gr);--green-2:var(--gr);--green-soft:var(--gr-soft);--gold:#7a5d00;--danger:var(--rd);--live:var(--rd);
  --display:"MC Festivo","Festivo",Impact,"Arial Narrow",sans-serif;--font:"MC Pressura","Pressura",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);--r:14px;--shadow:0 18px 40px rgba(0,0,0,.10);font-size:15px;line-height:1.6;letter-spacing:-.005em}
.m4 h1,.m4 h2,.m4 h3,.m4 h4{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.004em;font-synthesis:none;line-height:1}
.m4 h1{font-size:clamp(34px,4.6vw,60px)}.m4 h2{font-size:clamp(28px,3.4vw,44px)}.m4 h3{font-size:clamp(20px,1.8vw,24px)}
.m4 :focus-visible{outline:3px solid var(--y);outline-offset:3px}
.m4-kicker{font:500 12px/1.3 var(--font);letter-spacing:.14em;color:var(--gold)}
.m4-btn{border-radius:6px;font-weight:700;letter-spacing:.02em;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s}
.m4-btn--ghost{border-color:currentColor}
.m4-chip{border-radius:4px}
body.m4-body{background:var(--w,#fff)}
/* En el sitio del cliente la barra de evaluación no se pega: el encabezado de la marca queda arriba. */
body.m4-body:not(.m4-body--crm) .m4-strip{position:relative}

/* ---------- Primitivas v5 (sitio del cliente) ---------- */
.m5{background:var(--w);color:var(--k2)}
.m5 .m5-wrap{width:min(1200px,100% - 32px);margin-inline:auto}

.m5 .m5-lead{font-size:clamp(15px,1.25vw,17px);color:var(--g7);max-width:56ch;margin:0 0 18px}
.m5 .m5-dark .m5-lead,.m5 .m5-quote-hero .m5-lead,.m5 .m5-portal-head .m5-lead,.m5 .m5-band .m5-lead,.m5 .m5-exp-intro .m5-lead,.m5 .m5-hero .m5-lead,.m5 .m5-exp-copy .m5-lead{color:#d6d6d6}
.m5 .m5-quote-hero .m5-sup,.m5 .m5-band .m5-sup{color:#bdbdbd}
.m5 .m5-sup{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1.35;color:var(--g5);letter-spacing:.02em}

.m5 .m5-sec{padding:clamp(64px,9vw,120px) 0;position:relative}

@media (max-width:760px){.m5 .m5-head{grid-template-columns:1fr}}

/* Botones de marca: amarillo sobre negro, texto Festivo */
.m5 .m5-btn{--bg:var(--y);--fg:var(--k);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 22px 12px;border:0;border-radius:4px;background:var(--bg);color:var(--fg);font:500 19px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;text-decoration:none;cursor:pointer;position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s}
.m5 .m5-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(247,190,0,.28)}
.m5 .m5-btn:active{transform:translateY(0)}
.m5 .m5-btn .m4-i{transition:transform .25s var(--ease)}.m5 .m5-btn:hover .m4-i{transform:translateX(3px)}
.m5 .m5-btn small{font:500 11px/1.2 var(--font);text-transform:none;letter-spacing:0;opacity:.75;display:block}
.m5 .m5-btn--ghost{--bg:transparent;--fg:currentColor;box-shadow:inset 0 0 0 2px currentColor}

.m5 .m5-btn--dark{--bg:var(--k);--fg:#fff}
.m5 .m5-btn--sm{min-height:40px;padding:10px 14px 8px;font-size:16px}

.m5 .m5-dark .m5-cta-note{color:#bdbdbd}
.m5 .m5-link{background:none;border:0;padding:4px 0;color:inherit;font:inherit;font-weight:700;display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;text-decoration-color:var(--y);cursor:pointer}

/* Etiqueta de papel rasgado (como el banner oficial de máquinas) */
.m5 .m5-tag{display:inline-block;background:var(--y);color:var(--k);font:500 18px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:9px 16px 7px;clip-path:polygon(0 8%,4% 0,12% 6%,22% 1%,33% 7%,46% 2%,58% 6%,70% 0,82% 7%,93% 2%,100% 9%,99% 92%,92% 100%,80% 94%,68% 100%,55% 95%,43% 100%,30% 94%,18% 100%,7% 95%,1% 100%)}

.m5 .m5-tear{height:22px;background:var(--k);clip-path:polygon(0 0,100% 0,100% 40%,96% 70%,91% 45%,85% 80%,79% 50%,72% 85%,66% 55%,58% 90%,51% 50%,44% 80%,37% 45%,30% 85%,23% 55%,16% 90%,10% 50%,4% 80%,0 55%);margin-bottom:-1px}

/* Lead magnet v5 */
.m5 .m5-lm{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px 16px;border-radius:8px;background:rgba(247,190,0,.12);border:1px solid rgba(247,190,0,.55);margin:0 0 18px;max-width:520px}

.m5 .m5-lm--light .m4-i{color:#9a7400}

/* ---------- Película con scroll (secuencia de cuadros) ---------- */

/* ---------- Letra más presente y palabras clave que se notan (15-10, Carlitos: «la fuente está bien pero se nota poco: hazla más
   destacada, un poco más gruesa, y a las palabras clave de la comunicación ponles un efecto de brillo»).
   v6.3 (15-10, noche): «unos sombreados duros atrás hacen que la letra se vea sucia en vez de verse mejor; la idea era que se
   notara más». Se quitaron las sombras duras (desplazadas y casi sin desenfoque) y el trazo grueso con negrita sintética: la letra
   se engrosa con un trazo fino de su mismo color, la sombra es solo un velo suave y ancho para separar el texto de la foto, y las
   palabras clave se notan por color y no por sombra: marcador amarillo de marca detrás del texto oscuro sobre fondo claro, y
   amarillo de marca sin sombra sobre fondo oscuro.
   Las tipografías de marca (Festivo y GT Pressura) vienen de un solo peso y el titular trae font-synthesis:none,
   así que no engordan nunca: se engrosan con un trazo mínimo, que respeta la forma de la letra y no la deforma. */
.m5 h1,.m5 h2,.m5 h3,.m5 h4{-webkit-text-stroke:.01em currentColor;paint-order:stroke fill}
.m5 .m5-bar-name,.m5 .m5-svc h3,.m5 .m5-steps h3{-webkit-text-stroke:.01em currentColor}

  const UNION = { agents: 'id', notifs: 'id', emails: 'id', sched: 'id', events: 'key', lmi: 'id', services: 'id' };
  const unionBy = (a = [], b = [], k) => { const seen = new Set((a || []).map((x) => x[k])); return [...(a || []), ...(b || []).filter((x) => !seen.has(x[k]))].sort((x, y) => (x.at || 0) - (y.at || 0)); };
  function mergeStates(remote, local, keys) {
    const m = { ...remote };
    keys.forEach((k) => {
      if (UNION[k]) m[k] = unionBy(remote[k], local[k], UNION[k]);
      else if (k === 'conv' && remote.conv && local.conv) m.conv = { ...remote.conv, ...local.conv, status: remote.conv.status === 'atendida' || local.conv.status === 'atendida' ? 'atendida' : local.conv.status, msgs: unionBy(remote.conv.msgs, local.conv.msgs, 'id') };
      else m[k] = local[k];
    });
    m.rev = Math.max(remote.rev || 0, local.rev || 0) + 1;
    return m;
  }
  async function push() {
    if (!SYNC) return;
    if (posting) { dirty = true; return; }
    posting = true; dirty = false;
    const sentVersion = localVersion;
    try {
      const r = await fetch(SYNC.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ baseRev: serverRev, state }) });
      const j = await r.json();
      if (r.status === 409) { state = mergeStates(j.state, state, [...pendingKeys]); serverRev = j.rev; dirty = true; persistLocal(); emit(); }
      else if (r.ok) { serverRev = j.rev; if (localVersion === sentVersion) pendingKeys.clear(); else dirty = true; }
    } catch (_) { dirty = true; }
    posting = false;
    if (dirty) setTimeout(push, 300);
  }
  async function pull() {
    if (!SYNC || posting || dirty) return;
    try {
      const r = await fetch(`${SYNC.url}?rev=${serverRev}`, { cache: 'no-store' });
      if (r.status !== 200) return;
      const j = await r.json();
      if (posting || dirty) return; // llegó tarde: hay cambios locales en camino
      if (j.rev > serverRev && j.state) {
        serverRev = j.rev;
        if (!pendingKeys.size) state = j.state; else { state = mergeStates(j.state, state, [...pendingKeys]); dirty = true; setTimeout(push, 0); }

  }

  const subs = new Set();
  const subscribe = (fn) => { subs.add(fn); return () => subs.delete(fn); };
  const emit = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  window.addEventListener('storage', (e) => { if (e.key === KEY && !STATIC) { try { state = JSON.parse(e.newValue) || freshState(); } catch (_) { state = freshState(); } emit(); } });

  // ---------- Puntaje ----------
  function zonePts(comunaName) { const c = D.comuna(comunaName); return c ? D.TIERS[c.tier].pts : 0; }
  function track(s, key, at = now()) {
    if (!s.lead && key !== 'cotizar') ensureLead(s, at);
    if (s.events.some((e) => e.key === key)) return false;
    const pts = key === 'comuna' ? zonePts(s.answers.comuna) : EV[key].pts;
    const label = key === 'comuna' ? `Comuna: ${s.answers.comuna} (${D.TIERS[D.comuna(s.answers.comuna)?.tier || 'C'].label})` : EV[key].label;
    s.events.push({ key, pts, label, at });
    return true;
  }
  const score = (s = get()) => Math.min(100, s.events.reduce((a, e) => a + (e.pts || 0), 0));
  const identified = (s = get()) => Boolean(s.lead && s.lead.email && s.lead.consent);
  const isMQL = (s = get()) => identified(s) && HORECA.includes(s.answers.negocio) && score(s) >= 40;
  const sqlCandidate = (s = get()) => isMQL(s) && s.events.some((e) => e.key === 'ejecutivo' || e.key === 'propuesta');
  const stage = (s = get()) => (s.sql ? 'SQL' : isMQL(s) ? 'MQL' : s.lead ? 'Lead' : 'Visitante');

  function ensureLead(s, at = now()) {
    if (s.lead) return s.lead;

    return s.lead;
  }
  const execOf = (s = get()) => (s.answers.comuna ? D.execFor(s.answers.comuna) : D.EXECS.paula);
  const zoneOf = (s = get()) => { const c = D.comuna(s.answers.comuna); return c ? D.ZONES[c.zone] : null; };
  const firstName = (s = get()) => (s.lead?.name || '').trim().split(/\s+/)[0] || '';

  // ---------- Mensajes de agentes ----------
  const AGENTS = {

    mkt: { name: 'Marketing', short: 'MKT', color: '#7a5a00', role: 'Origen, campañas y nutrición' },
    cal: { name: 'Calificación', short: 'CAL', color: '#376a3c', role: 'Puntaje, zona y MQL' },
    ven: { name: 'Ventas', short: 'VEN', color: '#8a3b12', role: 'Recomendación y propuesta' },
    log: { name: 'Logística', short: 'LOG', color: '#2f5d7c', role: 'Stock, rutas y despachos' },
    post: { name: 'Postventa', short: 'POS', color: '#6b3a7a', role: 'Recompra, satisfacción y referidos' },
    bot: { name: 'Asistente de bienvenida', short: 'BOT', color: '#5c7e38', role: 'Recibe al cliente en el chat' }
  };
  function agent(s, from, to, text, actions = [], delay = 0, think = 900) {

  // ---------- Acciones del cliente ----------

  function startQuote(biz) {

      if (biz && !s.diag.done) { setBiz(s, biz); if (track(s, 'negocio')) agentOnAnswer(s, 'negocio'); if (s.diag.step === 0) s.diag.step = 1; }

  function saveContact({ name, email: mail, phone, consent }) {

  function passStart() { return update((s) => { const L = ensureLead(s); if (!L.formSeen) L.formSeen = now(); }); }
  // Las 5 claves del diagnóstico (las usa también el CRM: guion de llamada, ficha y propuesta).
  // 15-10: «Monodosis (pods)» sale de las bebidas porque es una máquina, no una bebida, y confundía.
  const QUESTIONS = [

    { key: 'comuna', title: '¿En qué comuna está tu local?', short: 'Comuna', options: null },
    { key: 'volumen', title: '¿Cuántas tazas sirves en un día normal?', short: 'Tazas al día', options: ['Menos de 50', 'De 50 a 150', 'De 150 a 400', 'Más de 400', 'No lo sé'] },
    { key: 'operacion', title: '¿Cómo sirves el café?', short: 'Cómo sirves', options: ['Barra con barista', 'Autoservicio', 'A la mesa o a la habitación', 'Mixto'] },
    { key: 'preferencias', title: '¿Qué te gustaría ofrecer?', short: 'Quieres ofrecer', options: ['Espresso y cappuccino', 'Café de filtro', 'Té y chai', 'Bebidas listas'], multi: true }
  ];
  const Q = Object.fromEntries(QUESTIONS.map((q) => [q.key, q]));
  // 3 pasos que se marcan. El paso 1 se salta si el negocio ya se conoce; el 3 llega marcado según el negocio.
  const STEPS = [

    { id: 'servicio', keys: ['operacion', 'preferencias'], title: 'Así sirves el café', help: 'Lo marcamos según tu negocio: cambia solo lo que no calce.' }
  ];
  // Lo típico de cada negocio (valor sugerido, siempre editable). Supuesto de trabajo del prototipo.
  const DEFAULTS = {
    Hotel: { volumen: 'De 150 a 400', operacion: 'Mixto', preferencias: ['Espresso y cappuccino', 'Té y chai'] },
    Restaurante: { volumen: 'De 50 a 150', operacion: 'A la mesa o a la habitación', preferencias: ['Espresso y cappuccino'] },
    'Cafetería': { volumen: 'De 150 a 400', operacion: 'Barra con barista', preferencias: ['Espresso y cappuccino', 'Café de filtro'] },
    'Eventos o catering': { volumen: 'De 150 a 400', operacion: 'Mixto', preferencias: ['Espresso y cappuccino', 'Bebidas listas'] },

  };
  function setBiz(s, biz) {
    s.answers.negocio = biz;

    ['volumen', 'operacion', 'preferencias'].forEach((k) => { if (!s.diag.touched[k]) s.answers[k] = Array.isArray(d[k]) ? [...d[k]] : d[k]; });
  }
  const suggested = (s, key) => Boolean(s.answers[key]) && !(s.diag.touched || {})[key];
  function answer(key, value) {
    return update((s) => {
      s.diag.touched = s.diag.touched || {};
      if (key === 'negocio') setBiz(s, value);
      else if (key === 'preferencias') {
        const all = Q.preferencias.options;
        if (value === '__todas') s.answers.preferencias = (s.answers.preferencias || []).length === all.length ? [] : [...all];
        else { const cur = new Set(s.answers.preferencias || []); cur.has(value) ? cur.delete(value) : cur.add(value); s.answers.preferencias = all.filter((o) => cur.has(o)); }

  const stepReady = (s, i = s.diag.step) => (STEPS[i] || STEPS[0]).keys.every((k) => { const v = s.answers[k]; return Array.isArray(v) ? v.length > 0 : Boolean(v); });
  function confirmStep() {

  // MQL: identificado (correo con permiso) + negocio HORECA + 40 puntos o más. Se revisa en cada acción que suma.

  function buildProposal(s) {

  // El cliente ve su propuesta (C05): cuenta como «Revisa su recomendación» (+8, tabla M2).

  function agentOnAnswer(s, key) {
    const a = s.answers;

      const tip = { Hotel: 'En hoteles el café aparece en el desayuno, en las habitaciones y en el lobby: conviene combinar la máquina Bar para el buffet y Pods para las habitaciones.', Restaurante: 'En restaurantes pesa el espresso de sobremesa: grano o molido con barra.', Cafetería: 'En cafetería el café es el producto principal: grano y variedad de preparaciones.', 'Eventos o catering': 'En eventos importa el volumen en pocas horas y la imagen de marca (tazas y material POP).' }[a.negocio] || 'Negocio fuera de los segmentos HORECA principales: lo revisa una persona.';

      s.lead.execId = ex.id;

      agent(s, 'orq', 'ven', `Asigno el contacto a ${ex.name} (${ex.role}). Hoy atiende ${ex.busy} conversación${ex.busy === 1 ? '' : 'es'}; espera estimada ${ex.waitMin} min.`, ['Asignar ejecutiva de zona ✓'], 700);
      agent(s, 'log', 'ven', `${z ? z.route : 'Ruta por confirmar'} (demo). ${c && c.tier !== 'R' ? 'Comuna cubierta por ruta propia.' : 'Fuera de ruta propia: despacho por transporte, plazo a confirmar.'}`, ['Consultar ruta de despacho (demo) ✓'], 1400);
    }

    if (key === 'operacion') agent(s, 'ven', 'orq', `Servicio: ${a.operacion.toLowerCase()}. Formato sugerido: ${formatFor(a).title}.`, ['Elegir formato ✓']);
    if (key === 'preferencias') agent(s, 'ven', 'log', `Quiere ofrecer ${a.preferencias.join(', ').toLowerCase()}. ¿Hay stock de los productos de la propuesta base y ampliada?`, ['Pedir revisión de stock']);
    if (key === 'preferencias') agent(s, 'log', 'ven', 'Stock disponible para 2 semanas en todos los productos de la propuesta (dato de demostración). Las tazas Marley Coffee se reservan al aceptar.', ['Consultar inventario (demo) ✓'], 1500);
  }
  function formatFor(a) {
    if (a.operacion === 'Autoservicio') return { title: 'Máquina Oficina para autoservicio', items: ['kom', 'chai', 'mug'] };
    if (a.negocio === 'Hotel') return { title: 'Bar para el desayuno y Pods en las habitaciones', items: ['kom', 'roots', 'chai'] };

  // fresh: después del diagnóstico manda la máquina que sale de las respuestas (no una elegida antes en el cotizador).
  function recommendation(s = get(), { fresh = false } = {}) {
    const f = formatFor(s.answers);
    const extra = ['mug', 'travel'].concat(s.answers.negocio === 'Eventos o catering' || s.answers.negocio === 'Hotel' ? ['rtd'] : ['chai']).filter((p) => !f.items.includes(p));
    const fic = (s.call && s.call.ficha) || {}; const q = (!fresh && s.quote) || {};
    const machine = fic.maquina && D.MACHINES && D.MACHINES[fic.maquina] ? fic.maquina : q.machine || (D.machineFor ? D.machineFor(s.answers) : 'bar');
    const mode = q.mode || 'arriendo';
    const fit = D.BUSINESS ? (D.BUSINESS[s.answers.negocio] || null) : null;
    // Solo entra lo que el cliente marcó; lo demás queda como recomendación de su negocio (15-10: «que se vea como una recomendación»).

  }
  // Estado del portal del cliente (v6, 4 etapas simples):
  // 1 Tu propuesta (lista al instante) · 2 Aceptas (sola o con tu ejecutiva) · 3 Coordinamos instalación · 4 Cliente activo
  function portalState(s = get()) {

    if ((s.lead && s.lead.channel) || (s.proposal && s.proposal.status === 'enviada')) return 2;

  // Política vigente: conversación web consultiva y seguimiento comercial por correo.
  function emailContact(s) {
    const lead = ensureLead(s);

    if (!lead.email) { lead.email = 'cliente.demo@example.com'; lead.demoEmail = true; }
    lead.followupChannel = 'correo';

  }
  function ensureDemoContact() {
    const s = get();

  function applyChannelPolicy(s) {

    (s.emails || []).forEach((e) => {
      if (/propuesta|aceptaste|solicitud/i.test(e.subject || '') && /^Marley Coffee Empresas/.test(e.from || '') && /por WhatsApp/.test(e.body || '')) {
        e.body = e.body.replace(/por WhatsApp(?: al [\d+\s]+)?/g, 'por correo');e.channel = 'correo';e.policyUpdated = true;

  function chooseChannel(ch, extra = {}) {

      const channel = ch === 'chat' ? 'chat' : 'correo';
      const alreadyPending = channel === 'correo' && s.consultation?.status === 'pendiente' && s.consultation.proposalId === (s.proposal?.id || null);
      lead.channel = channel; lead.followupChannel = 'correo'; lead.execId = ex.id;

      notify(s, 'crm', 'Correo por responder', `${lead.name} · ${lead.email}`);
    });
  }

  function enterPortal() {
    const cur = get(); const has = (k) => cur.events.some((e) => e.key === k);
    if (STATIC || (has('portal') && (!cur.diag.done || has('recomendacion')))) return cur; // sin cambios: no se vuelve a guardar

  function clientSend(text) {

  // Asistente mientras espera a la ejecutiva: responde lo que sabe (datos del prototipo, precios supuestos) y lo deriva.
  function botReply(s, text) {
    const ex = execOf(s); const fx = ex.name.split(' ')[0]; const t = text.toLowerCase();
    const r = recommendation(s); const m = D.MACHINES && D.MACHINES[r.machine];

  // Cotizador sin diagnóstico (entró por «Cotizar máquina»): la propuesta sale de lo que armó.
  function buildFromQuote(s) {
    const q = s.quote; if (!q || !q.machine) return;

  function setQuote(patch) {
    patch = { ...patch };

    return update((s) => {
      s.quote = Object.assign({ at: now() }, s.quote || {}, patch, { at: now() });

  // ---------- Lead magnets (LM4 a LM7): interés en ampliar, reposición, expansión y referido ----------
  // LM4 · el prospecto marca qué le interesa sumar mientras espera; llega al chat y a la propuesta ampliada.

  // Lo marcado entra a la propuesta; si el cliente ya conversa con su ejecutiva, ella lo ve también en el chat.
  function lmInterest(k) {

      if (i >= 0 || inProp) {

        if (open) s.proposal.services = (s.proposal.services || []).filter((x) => x !== k);
        if (s.quote) s.quote.services = (s.quote.services || []).filter((x) => x !== k);
        return;

      s.lmi.push({ id: uid('LMI'), k, lm: 'LM4', at: now() });
      if (open) s.proposal.services = [...(s.proposal.services || []), k];

  // ---------- Acciones del equipo (CRM) ----------

  // Ficha que la ejecutiva completa durante la llamada; el cliente ve en vivo «lo que van acordando».
  const FICHA = [['volumen', 'Tazas al día'], ['maquina', 'Máquina'], ['horario', 'Horario de despacho'], ['decide', 'Quién decide la compra'], ['inicio', 'Cuándo quiere partir']];
  function fichaFrom(s) { const f = {}; if (s.answers.volumen) f.volumen = s.answers.volumen; if (D.machineFor) f.maquina = (s.quote && s.quote.machine) || D.machineFor(s.answers); return f; }

  function callNotes(text) { return update((s) => { if (!s.call) return; s.call.notes = text; s.call.notesAt = now(); }); }
  function callOutcome(outcome, next = '') {

  // La ejecutiva envía la propuesta que sugirió el agente de ventas (con los ajustes del cliente). sim: la manda la ejecutiva simulada.
  function execProposal(s, { sim = false, via = 'portal' } = {}) {

    const p = s.proposal; if (!p || p.status === 'aceptada') return false;
    p.status = 'enviada'; p.by = ex.name; p.sentAt = now(); p.via = via;
    const m = D.MACHINES && D.MACHINES[p.machine]; const e = D.estimate ? D.estimate({ machine: p.machine, cups: p.cups, mode: p.mode, days: p.days || 26 }) : null;
    if (!s.conv) s.conv = { status: 'atendida', takenAt: now(), msgs: [] };
    if (s.conv.status !== 'atendida') { s.conv.status = 'atendida'; s.conv.takenAt = now(); convMsg(s, 'sistema', `${ex.name} se unió a la conversación`); }
    const extras = (p.services || []).map((k) => D.SERVICES[k] && D.SERVICES[k].t.toLowerCase()).filter(Boolean);
    convMsg(s, 'ejecutiva', `Te envío tu propuesta confirmada: ${m ? 'máquina ' + m.name + ' en ' + MODE_TXT[p.mode] : 'tu máquina'}, café para unas ${p.cups} tazas al día${e ? ', ' + D.rangeTxt(e.monthly[0], e.monthly[1], true) + ' al mes*' : ''}${extras.length ? ' y ' + extras.join(', ') : ''}. Si te parece bien, acéptala en «Tu propuesta» y coordinamos la instalación.`, sim ? 1400 : 0, sim ? 1600 : 0, { by: ex.name, proposal: true, sim });

    notify(s, 'client', `${ex.name} te envió tu propuesta`, 'Revísala y acéptala en tu portal');

    });

  // Cliente activo (C09): repetir el último pedido avisa al ejecutivo de cuenta y a Logística.

    const drops = reach.slice(1).map(([id, v], i) => [reach[i][0], id, reach[i][1] - v]).sort((a, b) => b[2] - a[2]); const d0 = drops[0];
    const post = ['LM5', 'LM6', 'LM7'].map((id) => [id, accs.filter((a) => a.lm[id]).length]);
    const lmCard = card('Lead magnets · cuántos llegan a cada uno', `<ul class="m4-hbars">${reach.map(([id, v]) => `<li><span>${id} · ${esc(D.LM[id].name)}</span>${bar((v / ls.length) * 100)}<b>${v}</b></li>`).join('')}</ul><h3 class="m4-sub">Clientes con compras (${accs.length})</h3><ul class="m4-hbars">${post.map(([id, v]) => `<li><span>${id} · ${esc(D.LM[id].name)}</span>${bar((v / accs.length) * 100, 'fin')}<b>${v}</b></li>`).join('')}</ul><p class="m4-nba">${icon('spark', 18)} ¿Qué decidir? La caída más grande está entre ${d0[0]} y ${d0[1]} (${d0[2]} contactos): probar un lead magnet más claro en esa pantalla.</p><p class="m4-fine">Prospectos y clientes de demostración. LM1–LM4 acompañan al prospecto; LM5–LM7 dan continuidad y escalan la experiencia del cliente.</p>`, `<button type="button" class="m4-link-btn" data-go="R09">Qué entrega cada uno</button>`);

<div class="m4-grid-2">${card('Contactos por origen', `<ul class="m4-hbars">${Object.entries(bySource).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><span>${esc(k)}</span>${bar((v / max) * 100)}<b>${v}</b></li>`).join('')}</ul>`)}
${card('Dónde están los contactos', `<p>Los prospectos de la Zona Oriente (prioridad A) llegan con más puntaje. Abre el mapa para ver comuna por comuna.</p><button type="button" class="m4-btn" data-go="R06">${icon('map', 18)} Abrir mapa</button>`)}</div>${lmCard}`, { sub: 'Origen de contactos, lead magnets y calidad por zona' });
  }

  // ---------- v6 · Lo que cotizó el cliente y la sugerencia del agente de ventas (IA) ----------
  // Test 15-10, P4 (ventas): «no salían los productos que cotizó, ni la propuesta sugerida que el CRM debería haber ofrecido».

  const MODE_TXT = { arriendo: 'arriendo', compra: 'compra directa' };

    if (!D.MACHINES[q.machine]) q.machine = 'bar';

  }

  function quotedCard(s) {
    const x = quoted(s);
    if (!x) return card('Lo que cotizó el cliente', '<p class="m4-empty">Aún no cotiza: su propuesta aparece aquí cuando termina sus 3 pasos.</p>', '', 'm5-quoted');
    const { q, m, e } = x; const extras = (q.services || []).map((k) => D.SERVICES[k] && D.SERVICES[k].t).filter(Boolean);
    return `<section class="m4-card m5-quoted"><div class="m4-card-head"><h2>Lo que cotizó el cliente</h2>${quoteChip(x.status)}</div>
<div class="m5-q-crm-m">${V5img(q.machine)}<div><b>${esc(m.name)}</b><small>${esc(m.kind)} · ${esc(MODE_TXT[q.mode] || q.mode)}</small></div></div>
<ul class="m4-kv"><li><span>Tazas al día</span><b>${q.cups}</b></li><li><span>Café al mes</span><b>${String(e.units).replace('.', ',')} ${e.unit === 'kg' ? 'kg' : 'pods'}</b></li><li><span>Total mensual*</span><b class="m5-price">${D.rangeTxt(e.monthly[0], e.monthly[1], true)}</b></li><li><span>Extras que eligió</span><b>${extras.length ? esc(extras.join(', ')) : 'Ninguno'}</b></li></ul>
<p class="m4-fine">En vivo: si el cliente cambia algo de su propuesta, se ve aquí al instante${x.p && x.p.editedAt ? ' (último ajuste ' + U.ago(x.p.editedAt) + ')' : ''}. * Supuesto académico.</p></section>`;
  }
  // Respuesta sugerida para la ejecutiva: saluda, confirma lo cotizado y contesta la última duda del cliente.
  function aiReply(s = M.get()) {
    const x = quoted(s); const ex = M.execOf(s); const nm = M.firstName(s);
    const last = [...((s.conv && s.conv.msgs) || [])].reverse().find((mm) => mm.from === 'cliente'); const t = ((last && last.text) || '').toLowerCase();
    let ans = '';
    if (/capacit/.test(t)) ans = ' La capacitación y la instalación se confirman en la propuesta formal.';
    else if (/habitaci/.test(t)) ans = ' Para las habitaciones te puedo sumar Pods.';
    else if (/precio|cu[aá]nto|cost|valor/.test(t) && x) ans = ` El total estimado es ${D.rangeTxt(x.e.monthly[0], x.e.monthly[1], true)} al mes y hoy te confirmo el precio real.`;
    else if (/instal|cu[aá]ndo|plazo|despacho/.test(t)) ans = ` La instalación va por la ${((M.zoneOf(s) || {}).route || 'ruta de tu comuna').toLowerCase()} (demo).`;
    return `Hola${nm ? ' ' + nm : ''}, soy ${ex.name.split(' ')[0]}. Ya vi tu propuesta${x ? `: ${x.m.name} en ${MODE_TXT[x.q.mode]} para unas ${x.q.cups} tazas al día` : ''}.${ans} ¿Te la envío confirmada para que la aceptes?`;

    const sugg = ((p && p.suggested) || []).filter((k) => !(x.q.services || []).includes(k) && D.SERVICES[k]).slice(0, 1).map((k) => D.SERVICES[k].t.toLowerCase());
    const sent = p && (p.status === 'enviada' || p.status === 'aceptada');
    return `<div class="m5-ai" role="note" aria-label="Sugerencia del agente de ventas">

<div class="m5-ai-actions">${!sent ? `<button type="button" class="m4-btn" data-a="send-proposal">${icon('send', 18)} Enviar propuesta sugerida</button>` : ''}<button type="button" class="m4-btn m4-btn--ghost" data-a="ai-reply">Usar respuesta sugerida</button><button type="button" class="m4-link-btn" data-go="R08">Ajustar antes de enviar</button></div></div>`;

  // Guía de primer uso (test 15-10, P4: «un mini tutorial que me fuera ayudando»): 3 pasos que se marcan solos y se cierra.
  function guide(s) {

    const done = [took, took, closed || Boolean(s.proposal && s.proposal.status === 'enviada')];
    if (done.every(Boolean)) return ''; // cumplida: no ocupa espacio
    const items = [['Toma la conversación', 'Botón amarillo sobre el chat'], ['Revisa lo que cotizó', 'Tarjeta «Lo que cotizó el cliente»'], ['Envía la propuesta sugerida', 'Tarjeta del agente, junto al chat']];

      const actions = [];

      center = `<div class="m4-thread-head">${avatar(sel.lead.name)}<div><b>${esc(sel.lead.name)}</b><small>${esc(sel.lead.company)} · ${U.channelIcon(sel.channel)} ${U.channelName(sel.channel)} · asignada a ${esc(ex.name)}</small></div><div class="m4-thread-actions">${actions.join('')}</div></div>${callCard}${aiCard(s)}
<div class="m4-chat-log" role="log" aria-live="polite" data-scroll="crm-log">${U.thread((s.conv && s.conv.msgs) || [], 'crm', s)}</div>
<div class="m4-quick">${[`Hola, soy ${ex.name}. Revisé tu propuesta.`, 'Te responderé por correo con las condiciones que faltan confirmar.', '¿Qué punto de la propuesta necesitas revisar?'].map((q) => `<button type="button" class="m4-quick-btn" data-a="exec-quick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
<form class="m4-composer" data-a="exec-send"><label class="m4-sr" for="m4ExecMsg">Respuesta</label><textarea id="m4ExecMsg" rows="2" placeholder="${s.lead.channel === 'correo' ? 'Responder por correo…' : 'Responder al cliente…'}"></textarea><button type="submit" class="m4-send" aria-label="Enviar">${icon('send', 18)}</button></form>`;
      side = quotedCard(s) + clientContext(sel.lead, true);

    return `<div class="m4 m4-crm m5-crm m5-roles-page"><main id="m4-main" class="m5-roles-main"><div class="m5-roles-head">${U.logo('m4-logo--sm')}<div><span class="m5-role-pill">CRM interno · Marley Coffee Empresas</span><h1>Ingreso de trabajadores</h1><p>Cada rol ve solo lo que necesita para decidir. Las métricas generales son de la jefatura.</p></div></div>

  function locked(id, rk) {
